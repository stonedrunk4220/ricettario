/* ---------- Timer integrato ---------- */
let audioCtx = null;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
function beep(){
  try{
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    for(let k = 0; k < 3; k++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, now + k*.35); g.gain.exponentialRampToValueAtTime(.3, now + k*.35 + .02); g.gain.exponentialRampToValueAtTime(.0001, now + k*.35 + .3);
      o.start(now + k*.35); o.stop(now + k*.35 + .32);
    }
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){}
}
const TK = 'ricettario.timers.v1';
const T = {list:[], state:'hidden', refs:new Map(), lastBeep:0};
function tLeft(t){ return t.done ? 0 : t.paused ? t.remaining : Math.max(0, t.end - Date.now()); }
function fmtClock(ms){
  const s = Math.ceil(ms/1000), h = Math.floor(s/3600), m = Math.floor((s % 3600)/60), ss = s % 60;
  return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0') : m + ':' + String(ss).padStart(2,'0');
}
function tSave(){ try{ localStorage.setItem(TK, JSON.stringify(T.list)); }catch(e){} }
function tLoad(){ try{ const a = JSON.parse(localStorage.getItem(TK) || '[]'); if(Array.isArray(a)) T.list = a.filter(t => t && t.id && t.total); }catch(e){} }
function startTimer(label, minutes){
  unlockAudio();
  const total = Math.max(1000, Math.round(minutes * 60000));
  T.list.push({id: Math.random().toString(36).slice(2), label: label || 'Timer', total, end: Date.now() + total, paused:false, remaining:0, done:false});
  tPushSync(T.list[T.list.length - 1]);
  tSave(); if(T.state === 'hidden') T.state = 'compact';
  tRender(); toast('Timer avviato: ' + fmtMin(minutes));
}
function tAction(id, act){
  const t = T.list.find(x => x.id === id); if(!t) return;
  unlockAudio();
  if(act === 'stop'){ T.list = T.list.filter(x => x !== t); if(!T.list.length && T.state !== 'open') T.state = 'hidden'; }
  else if(act === 'pause' && !t.done){ t.remaining = Math.max(0, t.end - Date.now()); t.paused = true; }
  else if(act === 'resume'){ t.end = Date.now() + t.remaining; t.paused = false; }
  else if(act === 'plus'){ if(t.done){ t.done = false; t.paused = false; t.end = Date.now() + 60000; t.total = Math.max(t.total, 60000); } else if(t.paused) t.remaining += 60000; else t.end += 60000; t.total += 60000; }
  else if(act === 'restart'){ t.done = false; t.paused = false; t.end = Date.now() + t.total; }
  if(act === 'stop') tPushCancel(t.id); else tPushSync(t);
  tSave(); tRender();
}
function tPos(){ const d = document.getElementById('tdock'); if(d) d.style.setProperty('--dock-b', tDockBottom() + 'px'); }
function setDock(state){
  if(state === 'hidden' && T.list.length) state = 'compact';
  T.state = state; tRender();
}
function openTimers(){ unlockAudio(); setDock('open'); }
function tDockBottom(){

  return cooking ? 96 : editing ? 84 : sheet ? 16 : 76;
}
/* render strutturale: solo quando cambia l'elenco o lo stato, mai a ogni secondo */
function tRender(){

  dock.style.setProperty('--dock-b', tDockBottom() + 'px');

      (t.done ? '<button data-ta="plus" aria-label="Aggiungi un minuto">+1 min</button><button data-ta="stop" aria-label="Ferma">Fatto</button>'
        : '<button data-ta="plus" aria-label="Aggiungi un minuto">+1</button>' + (t.paused ? '<button data-ta="resume" aria-label="Riprendi">▶</button>' : '<button data-ta="pause" aria-label="Pausa">❚❚</button>') + '<button data-ta="stop" aria-label="Elimina timer">✕</button>') +
      '</div><div class="t-bar"><i data-r="bar"></i></div><div class="t-lbl">' + esc(t.label) + ' · ' + fmtMin(t.total/60000) + '</div></div>';
  }).join('') : '<div class="tempty">Nessun timer attivo. Avviane uno qui sotto o dai passaggi di una ricetta.</div>';
  list.querySelectorAll('.trow').forEach(row => T.refs.set(row.dataset.tid, {time: row.querySelector('[data-r=time]'), bar: row.querySelector('[data-r=bar]')}));
  tTick(true);

/* aggiornamento leggero: cambia solo i testi e le barre */
function tTick(fromRender){
  const now = Date.now(); let changed = false;
  T.list.forEach(t => { if(!t.done && !t.paused && t.end <= now){ t.done = true; changed = true; } });
  if(changed){ tSave(); beep(); T.lastBeep = now; if(T.state === 'hidden') T.state = 'compact'; if(!fromRender){ tRender(); return; } }
  const anyDone = T.list.some(t => t.done);
  if(anyDone && now - T.lastBeep > 6000){ beep(); T.lastBeep = now; }
  $('#tdock').classList.toggle('has-done', anyDone);
  T.list.forEach(t => {
    const r = T.refs.get(t.id); if(!r) return;
    const left = tLeft(t), txt = t.done ? 'Fatto!' : fmtClock(left);
    if(r.time.textContent !== txt) r.time.textContent = txt;
    r.bar.style.width = (t.done ? 100 : (1 - left / t.total) * 100).toFixed(1) + '%';
  });
  // barra compatta: il timer più urgente
  const sorted = T.list.slice().sort((a,b) => (b.done - a.done) || (a.paused - b.paused) || (tLeft(a) - tLeft(b)));
  const top = sorted[0];
  if(top){
    const left = tLeft(top);
    const ct = top.done ? 'Fatto!' : fmtClock(left);
    const el = $('#tcTime'); if(el.textContent !== ct) el.textContent = ct;
    const lb = $('#tcLbl'), lt = top.done ? top.label + ' · tocca per fermarlo' : (top.paused ? 'In pausa · ' : '') + top.label;
    if(lb.textContent !== lt) lb.textContent = lt;
    const C = 2 * Math.PI * 17; $('#tcRing').style.strokeDashoffset = (C * (top.done ? 0 : left / top.total)).toFixed(2);
    const more = $('#tcMore'), mt = T.list.length > 1 ? '+' + (T.list.length - 1) : '';
    if(more.textContent !== mt){ more.textContent = mt; more.classList.toggle('hidden', !mt); }
  }
}
setInterval(() => { if(T.list.length) tTick(false); }, 250);
document.addEventListener('visibilitychange', () => { if(!document.hidden && T.list.length) tTick(false); });
/* trascinamento: su per aprire, giù per tornare compatto */
function tInitDrag(){
  const panel = $('#tdockPanel');
  const drag = (el, mode) => {
    let y0 = null, dy = 0, moved = false;
    el.addEventListener('pointerdown', e => { if(e.target.closest('button,input') && mode === 'panel') return; y0 = e.clientY; dy = 0; moved = false; try{ el.setPointerCapture(e.pointerId); }catch(x){} });
    el.addEventListener('pointermove', e => {
      if(y0 == null) return; dy = e.clientY - y0; if(Math.abs(dy) > 6) moved = true;
      if(mode === 'panel' && dy > 0){ panel.classList.add('dragging'); panel.style.transform = 'translateY(' + dy + 'px)'; }
      if(mode === 'compact' && dy < 0) el.style.transform = 'translateY(' + Math.max(dy, -40) + 'px)';
    });
    const end = () => {
      if(y0 == null) return; y0 = null;
      panel.classList.remove('dragging'); panel.style.transform = ''; el.style.transform = '';
      if(mode === 'panel' && dy > 70) setDock('compact');
      if(mode === 'compact'){ if(!moved || dy < -25) openTimers(); }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', () => { y0 = null; panel.classList.remove('dragging'); panel.style.transform = ''; el.style.transform = ''; });
  };
  drag($('#tdockCompact'), 'compact');
  drag($('#tgrab'), 'panel'); drag($('#tpHead'), 'panel');
  $('#tdockScrim').addEventListener('click', () => setDock('compact'));
  $('#tdock').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.ta){ tAction(b.closest('.trow').dataset.tid, b.dataset.ta); return; }
    if(b.dataset.tp){ startTimer('Timer ' + fmtMin(Number(b.dataset.tp)), Number(b.dataset.tp)); return; }
    if(b.id === 'tcGo'){ const v = parseFloat(($('#tcIn').value || '').replace(',','.')); if(v > 0){ startTimer(($('#tcName').value || '').trim() || 'Timer ' + fmtMin(v), v); $('#tcIn').value = ''; $('#tcName').value = ''; } else toast('Scrivi quanti minuti'); return; }
    if(b.id === 'tpClose') setDock(T.list.length ? 'compact' : 'hidden');
  });
}

async function downscale(file, max){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', .82));
  } finally { URL.revokeObjectURL(url); }
}

const FILE_ACCEPT = 'image/*,.pdf,application/pdf,.docx,.odt,.txt,.md,.rtf,.html,.htm,.csv,.json,.doc';
const MAX_FILE_TEXT = 60000;
let pdfjsP = null;
function loadPdfjs(){
  if(!pdfjsP) pdfjsP = import(new URL('lib/pdf.min.js', location.href).href).then(m => { m.GlobalWorkerOptions.workerSrc = new URL('lib/pdf.worker.min.js', location.href).href; return m; }).catch(e => { pdfjsP = null; throw e; });
  return pdfjsP;
}
function decodeXmlText(s){
  return s.replace(/<[^>]+>/g, '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g, (m, n) => String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCodePoint(parseInt(n,16))).replace(/&amp;/g,'&');
}
async function unzipText(buf, wanted){
  const dv = new DataView(buf), len = buf.byteLength, dec = new TextDecoder();
  let eocd = -1;
  for(let i = len - 22; i >= Math.max(0, len - 65557); i--){ if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('not_zip');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  for(let k = 0; k < n; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nl));
    if(name === wanted){
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const data = new Uint8Array(buf, start, csize);
      if(method === 0) return dec.decode(data);
      if(method === 8){
        if(typeof DecompressionStream === 'undefined') throw new Error('no_inflate');
        const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
        return dec.decode(out);
      }
      throw new Error('zip_method');
    }
    p += 46 + nl + el + cl;
  }
  return null;
}
function rtfToText(s){
  return s.replace(/\\par[d]?/g, '\n').replace(/\{\\\*[^{}]*\}/g, '').replace(/\\'([0-9a-f]{2})/gi, (m, h) => String.fromCharCode(parseInt(h,16))).replace(/\\[a-z]+-?\d* ?/gi, '').replace(/[{}]/g, '').replace(/\n{3,}/g, '\n\n');
}
async function canvasPages(pdf, count){
  const out = [];
  for(let i = 1; i <= Math.min(count, pdf.numPages); i++){
    const page = await pdf.getPage(i); const v1 = page.getViewport({scale:1});
    const sc = Math.min(2.5, 1600 / Math.max(v1.width, v1.height)); const v = page.getViewport({scale: sc});
    const c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: v}).promise;
    out.push(await new Promise(r => c.toBlob(r, 'image/jpeg', .85)));
  }
  return out;
}
/* Restituisce {kind, label, text?, images?} oppure lancia un Error con un messaggio per l'utente */
async function readAttachment(file){
  const name = file.name || 'file', ext = (name.split('.').pop() || '').toLowerCase(), type = file.type || '';
  if(type.startsWith('image/') || ['jpg','jpeg','png','webp','gif','heic','heif'].includes(ext)){
    try{ return {kind:'img', label:'Foto', images:[await downscale(file, 1600)]}; }
    catch(e){ throw new Error('Impossibile aprire questa immagine (se è HEIC, prova a esportarla come JPG).'); }
  }
  if(ext === 'pdf' || type === 'application/pdf'){
    let pdfjs; try{ pdfjs = await loadPdfjs(); }catch(e){ throw new Error('Impossibile caricare il lettore PDF in questa vista. Prova a fare uno screenshot delle pagine.'); }
    const pdf = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
    let text = '';
    for(let i = 1; i <= Math.min(pdf.numPages, 40) && text.length < MAX_FILE_TEXT; i++){
      const tc = await (await pdf.getPage(i)).getTextContent();
      text += tc.items.map(it => (it.str || '') + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
    }
    const pages = pdf.numPages + (pdf.numPages === 1 ? ' pagina' : ' pagine');
    if(text.replace(/\s/g, '').length < 30){
      // PDF scansionato: passo le prime pagine come immagini
      const imgs = await canvasPages(pdf, 3);
      return {kind:'pdf', label:'PDF scansionato · ' + pages, images: imgs};
    }
    return {kind:'pdf', label:'PDF · ' + pages, text: text.slice(0, MAX_FILE_TEXT)};
  }
  if(ext === 'docx' || ext === 'odt'){
    let xml;
    try{ xml = await unzipText(await file.arrayBuffer(), ext === 'docx' ? 'word/document.xml' : 'content.xml'); }
    catch(e){ throw new Error(e.message === 'no_inflate' ? 'Questo telefono non riesce ad aprire i file Word: salvalo come PDF o copia il testo.' : 'Il file sembra danneggiato o non è un documento valido.'); }
    if(!xml) throw new Error('Non trovo testo in questo documento.');
    const t = ext === 'docx'
      ? decodeXmlText(xml.replace(/<w:tab\/>/g, '\t').replace(/<w:br[^>]*\/>/g, '\n').replace(/<\/w:p>/g, '\n'))
      : decodeXmlText(xml.replace(/<text:tab\/>/g, '\t').replace(/<text:line-break\/>/g, '\n').replace(/<\/text:(p|h)>/g, '\n'));
    return {kind:'doc', label: ext === 'docx' ? 'Word' : 'Documento', text: t.replace(/\n{3,}/g, '\n\n').trim().slice(0, MAX_FILE_TEXT)};
  }
  if(ext === 'doc') throw new Error('I vecchi file .doc non si possono leggere qui: aprilo e salvalo come .docx o PDF.');
  if(ext === 'html' || ext === 'htm' || type === 'text/html'){
    const d = new DOMParser().parseFromString(await file.text(), 'text/html');
    d.querySelectorAll('script,style,nav,footer,header,noscript').forEach(n => n.remove());
    return {kind:'txt', label:'Pagina web', text: (d.body ? d.body.innerText || d.body.textContent : '').replace(/\n\s*\n\s*\n+/g, '\n\n').trim().slice(0, MAX_FILE_TEXT)};
  }
  if(ext === 'rtf') return {kind:'txt', label:'Testo', text: rtfToText(await file.text()).slice(0, MAX_FILE_TEXT)};
  const t = await file.text();
  if(/[\u0000-\u0008\u000E-\u001F]/.test(t.slice(0, 2000))) throw new Error('Questo tipo di file non si può leggere. Usa foto, PDF, Word o testo.');
  return {kind:'txt', label:'Testo', text: t.slice(0, MAX_FILE_TEXT)};
}

  const isEdit = mode === 'edit', voice = mode === 'dictate' || isEdit;
  if(!S.sample){ modal('<h3>L\'assistente AI non è disponibile</h3><p>Accedi al ricettario per usare l\'assistente AI. Puoi sempre scrivere o modificare la ricetta a mano.</p><div class="modal-actions"><button class="btn primary" data-x>Ok</button></div>', (m, c) => m.querySelector('[data-x]').onclick = c); return; }
  // la dettatura deve partire direttamente dal tocco, prima di qualsiasi attesa
  const prefill = ctx && ctx.prefill ? String(ctx.prefill) : '';
  if(voice && S.dict && !prefill) startDictation();
  const atts = [];
  const maxImgs = S.sampleMaxImages || 3;
  const T = {
    create: {title:'Crea con l\'AI', go:'Genera bozza', intro:'Incolla una ricetta, descrivi un\'idea («torta di mele soffice per 8») oppure allega una foto o un file (PDF, Word, testo). Riceverai una bozza da controllare prima di salvarla.', ph:'Es. Carbonara per 4: 320 g spaghetti, 150 g guanciale, 4 tuorli, pecorino…'},
    dictate: {title:'Crea con l\'AI', go:'Compila la ricetta', intro:'Parla liberamente, come se la spiegassi a un amico: nome del piatto, per quante persone, ingredienti con le quantità, passaggi e tempi. Puoi correggerti mentre parli («anzi, 300 grammi»).', ph:'Es. Torta di mele per otto persone. Servono tre mele, duecento grammi di farina, tre uova…'},
    link: {title:'Crea con l\'AI', go:'Crea dalla pagina', intro:'Incolla il link della ricetta: l\'assistente apre la pagina, prende solo la ricetta (anche la foto) e scarta pubblicità e chiacchiere. Se un sito blocca l\'accesso, aggiungi qui sotto il testo copiato o qualche screenshot.', ph:'Facoltativo: testo copiato dalla pagina…'},
    edit: {title:'Modifica a voce', go:'Applica le modifiche', intro:'Di\' cosa cambiare in «' + esc(ctx && ctx.title || 'questa ricetta') + '»: «aggiungi 50 g di burro», «togli l\'aglio», «la cottura è 40 minuti», «fallo per 6 persone», «metti nelle note che si congela».', ph:'Es. Usa 400 grammi di pasta invece di 320 e aggiungi un pizzico di peperoncino…'}
  }[mode];
  modal(
    '<h3>' + T.title + '</h3>' +
    (isEdit ? '' : '<div class="seg ai-tabs" role="tablist">' + AI_TABS.map(([k, l]) => '<button role="tab" data-aitab="' + k + '" aria-pressed="' + (k === mode) + '">' + l + '</button>').join('') + '</div>') +
    '<p>' + T.intro + '</p>' +
    (voice ? micRowHtml(!!S.dict && !prefill) : '') +
    (mode === 'link' ? '<div class="field"><label for="ai_url">Link della ricetta</label><input class="inp" id="ai_url" type="url" inputmode="url" placeholder="https://…" autocomplete="off"></div>' : '') +
    '<textarea class="inp" id="ai_txt" rows="' + (voice ? 8 : 7) + '" placeholder="' + esc(T.ph) + '"></textarea>' +
    (voice ? '<div class="partial" id="dict_partial" aria-live="polite"></div>' : '') +
    ((mode === 'create' || mode === 'link') ? '<div class="attach-row"><span class="btn small file-btn">' + IC.clip + (mode === 'link' ? ' Screenshot o file' : ' Foto o file') + '<input type="file" id="ai_img" accept="' + FILE_ACCEPT + '" multiple aria-label="Aggiungi foto o file"></span><span class="hint">Foto, PDF, Word, testo</span></div><div class="atts" id="ai_atts"></div>' : '') +
    '<div id="ai_status" class="hint" aria-live="polite"></div>' +
    '<div class="modal-actions"><button class="btn" data-a="no">Annulla</button><button class="btn primary" data-a="go">' + T.go + '</button></div>',
    (m, closeFn) => {
      const ctrl = {aborted:false};
      m.closest('.modal-back').addEventListener('click', e => { if(e.target === e.currentTarget){ ctrl.aborted = true; stopDictation(); if(ctrl.jobId){ S.waitingJobs.delete(ctrl.jobId); store.markJobSeen(ctrl.jobId).catch(() => {}); } } });
      m.querySelector('[data-a=no]').onclick = () => { ctrl.aborted = true; stopDictation(); if(ctrl.jobId){ S.waitingJobs.delete(ctrl.jobId); store.markJobSeen(ctrl.jobId).catch(() => {}); } closeFn(); };
      m.querySelectorAll('[data-aitab]').forEach(b => b.onclick = () => {
        if(b.dataset.aitab === mode) return;
        const keep = m.querySelector('#ai_txt').value;
        ctrl.aborted = true; stopDictation(); closeFn(); openAI(b.dataset.aitab);
        const ta = document.getElementById('ai_txt'); if(ta && keep) ta.value = keep;
      });
      if(prefill){ const ta = m.querySelector('#ai_txt'); ta.value = prefill; }
      const db = m.querySelector('#dict_btn');
      if(db) db.onclick = () => { if(S.dict.active()) stopDictation(); else startDictation(); };
      if(!S.dict || !voice) setTimeout(() => { const f = m.querySelector(mode === 'link' ? '#ai_url' : '#ai_txt'); f && f.focus({preventScroll:true}); }, 60);
      const drawAtts = () => {
        const box = m.querySelector('#ai_atts'); if(!box) return;
        box.innerHTML = atts.map((a, i) => '<span class="att' + (a.error ? ' err' : '') + '">' +
          (a.loading ? '<span class="spin"></span>' : a.thumb ? '<img src="' + a.thumb + '" alt="">' : '<span class="att-ic">' + esc((a.ext || '?').slice(0,4).toUpperCase()) + '</span>') +
          '<span class="att-t"><b>' + esc(a.name) + '</b><small>' + esc(a.loading ? 'Lettura del file…' : a.error || a.label) + '</small></span><button data-rmatt="' + i + '" aria-label="Togli ' + esc(a.name) + '">✕</button></span>').join('');
      };
      m.addEventListener('click', e => { const b = e.target.closest('[data-rmatt]'); if(b){ const a = atts.splice(Number(b.dataset.rmatt), 1)[0]; if(a && a.thumb) URL.revokeObjectURL(a.thumb); drawAtts(); } });
      const fi = m.querySelector('#ai_img');
      if(fi) fi.onchange = async () => {
        const files = [...fi.files]; fi.value = ''; if(!files.length) return;
        for(const f of files.slice(0, 6)){
          const a = {name: f.name || 'file', ext: (f.name || '').split('.').pop(), loading: true}; atts.push(a); drawAtts();
          try{ Object.assign(a, await readAttachment(f)); if(a.images && a.images[0]) a.thumb = URL.createObjectURL(a.images[0]); }
          catch(err){ a.error = err && err.message && err.message.length < 200 ? err.message : 'Impossibile leggere questo file.'; }
          a.loading = false; drawAtts();
        }
      };
      m.querySelector('[data-a=go]').onclick = async (ev) => {
        const btn = ev.currentTarget, st = m.querySelector('#ai_status');
        await stopDictation();
        const txt = m.querySelector('#ai_txt').value.trim();
        const url = mode === 'link' ? m.querySelector('#ai_url').value.trim() : '';
        if(atts.some(a => a.loading)){ st.textContent = 'Aspetta un attimo: sto ancora leggendo i file.'; return; }
        const okAtts = atts.filter(a => !a.error);
        const imgs = okAtts.flatMap(a => a.images || []).slice(0, maxImgs);
        const fileText = okAtts.filter(a => a.text).map(a => '--- Contenuto del file «' + a.name + '» ---\n' + a.text).join('\n\n');
        if(!txt && !imgs.length && !fileText && !(mode === 'link' && /^https?:\/\//i.test(url))){
          st.textContent = isEdit ? 'Descrivi cosa modificare, a voce o per iscritto.' : mode === 'dictate' ? 'Nessun testo rilevato: detta la ricetta o scrivila nel riquadro.' : mode === 'link' ? (url ? 'Il link deve iniziare con https://' : 'Incolla il link della ricetta.') : 'Scrivi qualcosa o aggiungi una foto.';
          return;
        }
        btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (isEdit ? 'Applicazione…' : 'Elaborazione…');
        st.textContent = 'Invio all\'assistente AI…';
        const onJob = id => {
          ctrl.jobId = id; S.waitingJobs.add(id);
          st.innerHTML = 'L\'assistente ci sta lavorando. <b>Puoi anche bloccare il telefono o chiudere l\'app</b>: ' + (isEdit ? 'le modifiche vengono preparate' : 'la ricetta viene preparata') + ' lo stesso e la ritrovi qui.';
        };
        const done = () => { if(ctrl.jobId){ S.waitingJobs.delete(ctrl.jobId); store.markJobSeen(ctrl.jobId).catch(() => {}); } };
        try{
          if(isEdit){
            const res = await aiEdit(ctx.form, txt, onJob);
            done(); if(ctrl.aborted) return;
            closeFn(); ctx.apply(res, txt);
          } else {
            const draft = await aiDraft([txt, fileText].filter(Boolean).join('\n\n').slice(0, 120000), imgs, mode, url, {source: mode, transcript: (txt || url).slice(0, 4000), url: url || null}, onJob);
            done(); if(ctrl.aborted) return;
            closeFn(); openEditor(draft, true, {source: mode, transcript: txt || url, doubts: draft._doubts || []});
            if(draft._imageBlob && S.edit){ S.edit.newPhoto = draft._imageBlob; S.edit.newPhotoUrl = URL.createObjectURL(draft._imageBlob); renderEditor(); }
          }
        }catch(e){
          done();
          btn.disabled = false; btn.textContent = T.go;
          st.textContent = e && e.code && !['images_unavailable','image_rejected','not_granted'].includes(e.code) ? aiErrorText(e) : e && e.code === 'images_unavailable' ? 'Le immagini non sono disponibili in questa modalità: incolla il testo della ricetta.' : e && e.code === 'image_rejected' ? 'Questa immagine non va bene (troppo grande o troppe immagini): provane un\'altra.' : e && e.code === 'rate_limited' ? 'Troppe richieste ravvicinate: aspetta un minuto e riprova.' : e && e.code === 'not_granted' ? 'Permesso non concesso: puoi comunque fare tutto a mano.' : 'Operazione non riuscita. Riprova, magari con parole diverse.';
        }
      };
    });
}
function normDraft(d){
  d = d && typeof d === 'object' ? d : {};
  return {
    title: String(d.title || ''), category: String(d.category || ''), tags: Array.isArray(d.tags) ? d.tags.map(String) : [],
    servings: d.servings ?? '', servingsUnit: d.servingsUnit || 'porzioni',
    prepMin: d.prepMin ?? '', cookMin: d.cookMin ?? '', restMin: d.restMin ?? '',
    difficulty: d.difficulty || 'facile',
    ingredients: Array.isArray(d.ingredients) ? d.ingredients.map(String) : [''],
    steps: Array.isArray(d.steps) ? d.steps.map(s => ({text:String(s), timerMin:''})) : [{text:'', timerMin:''}],
    notes: String(d.notes || ''), source: String(d.source || ''), favorite:false, photoId:null,
    _doubts: Array.isArray(d.doubts) ? d.doubts.map(String).slice(0,6) : [],
    _changes: Array.isArray(d.changes) ? d.changes.map(String).slice(0,10) : []
  };
}
async function aiDraft(text, images, kind, url, meta, onJob){
  const res = kind === 'link'
    ? await store.ai({action:'link', url, text, images: images || [], meta}, {onJob})
    : await store.ai({action:'draft', kind: kind === 'dictate' ? 'dictate' : 'create', text, images: images || [], meta}, {onJob});
  const d = normDraft(res.result);
  if(url && !d.source) d.source = url;
  if(res.photoPath) d.photoId = res.photoPath;
  if(res.imageBlob) d._imageBlob = res.imageBlob;
  d._jobId = res.jobId || null;
  return d;
}
function formToPlain(r){
  return {title:r.title || '', category:r.category || '', tags: String(r.tagsText ?? (r.tags || []).join(', ')).split(',').map(t => t.trim()).filter(Boolean),
    servings: r.servings === '' ? null : Number(r.servings) || null, servingsUnit: r.servingsUnit || 'porzioni',
    prepMin: r.prepMin === '' || r.prepMin == null ? null : Number(r.prepMin), cookMin: r.cookMin === '' || r.cookMin == null ? null : Number(r.cookMin), restMin: r.restMin === '' || r.restMin == null ? null : Number(r.restMin),
    difficulty: r.difficulty || 'facile', ingredients: (r.ingredients || []).map(ingToText).filter(t => t.trim()),
    steps: (r.steps || []).map(s => typeof s === 'string' ? s : s.text).filter(t => String(t).trim()), notes: r.notes || '', source: r.source || ''};
}
async function aiEdit(form, instruction, onJob){
  const res = await store.ai({action:'edit', form: formToPlain(form), instruction, meta: {source: 'modifica'}}, {onJob});
  const d = normDraft(res.result); d._jobId = res.jobId || null;
  return d;
}
function voiceEdit(fromEditor){
  let form, title;
  if(fromEditor && S.edit){ form = S.edit.r; title = S.edit.variant ? ((getR(S.edit.variant.of) || {}).title || '') + ' (' + (S.edit.r.variantName || 'variante') + ')' : S.edit.r.title; }
  else { const r = curR(); if(!r) return; form = r; title = titleWithVariant(r); }
  openAI('edit', {title, form, apply: (res, txt) => {
    const meta = {source:'modifica', transcript: txt, doubts: res._doubts, changes: res._changes};
    if(fromEditor && S.edit){
      const E = S.edit, old = E.r;
      meta.old = snapshotForm(old);
      const keepTimers = new Map((old.steps || []).map(s => [s.text, s.timerMin]));
      Object.assign(old, {title: res.title || old.title, category: res.category, tagsText: res.tags.join(', '), servings: res.servings, servingsUnit: res.servingsUnit, prepMin: res.prepMin, cookMin: res.cookMin, restMin: res.restMin, difficulty: res.difficulty, notes: res.notes, source: res.source,
        ingredients: res.ingredients.length ? res.ingredients : [''], steps: res.steps.length ? res.steps.map(s => ({text:s.text, timerMin: keepTimers.get(s.text) ?? ''})) : [{text:'', timerMin:''}]});
      if(E.variant) old.title = (getR(E.variant.of) || {}).title || old.title;
      E.meta = meta; renderEditor(); $('#sheetEdit').scrollTop = 0;
    } else {
      const r = curR(); if(!r) return;
      const keepTimers = new Map((r.steps || []).map(s => typeof s === 'string' ? [s, null] : [s.text, s.timerMin]));
      const merged = Object.assign(JSON.parse(JSON.stringify(r)), {title: res.title || r.title, category: res.category, tags: res.tags, servings: res.servings, servingsUnit: res.servingsUnit, prepMin: res.prepMin, cookMin: res.cookMin, restMin: res.restMin, difficulty: res.difficulty, notes: res.notes, source: res.source,
        ingredients: res.ingredients, steps: res.steps.map(s => ({text:s.text, timerMin: keepTimers.get(s.text) ?? ''}))});
      meta.old = snapshotForm(Object.assign({}, r, {ingredients:(r.ingredients||[]).map(ingToText), steps:(r.steps||[]).map(s => typeof s === 'string' ? {text:s} : s), tagsText:(r.tags||[]).join(', ')}));
      if(S.variantId){ merged.title = r.title; openEditor(merged, false, meta, {of: S.openId, id: S.variantId}); }
      else { delete merged.variantId; delete merged.variantName; openEditor(merged, false, meta); }
    }
  }});
}
function snapshotForm(r){
  return {fields: {title:String(r.title ?? ''), category:String(r.category ?? ''), tagsText:String(r.tagsText ?? ''), servings:String(r.servings ?? ''), servingsUnit:String(r.servingsUnit ?? ''), prepMin:String(r.prepMin ?? ''), cookMin:String(r.cookMin ?? ''), restMin:String(r.restMin ?? ''), notes:String(r.notes ?? ''), source:String(r.source ?? '')},
    ing: new Set((r.ingredients || []).map(ingToText)), steps: new Set((r.steps || []).map(s => typeof s === 'string' ? s : s.text))};
}

}
async function importFile(file){
  try{
    const j = JSON.parse(await file.text());
    const list = Array.isArray(j) ? j : j.recipes;
    if(!Array.isArray(list)) throw new Error('formato');
    const ok = await askBox('Importare ' + list.length + ' ricette?', 'Vengono aggiunte al ricettario «' + (BOOT.book ? BOOT.book.name : '') + '», foto comprese se il backup le contiene. Può volerci qualche secondo.', 'Importa');
    if(!ok) return;
    toast('Importo le ricette…');
    let n = 0;
    for(const r of list){
      const id = isUuid(r.id) ? r.id : uid();
      const data = cleanRecipe(r); data.createdAt = r.createdAt || new Date().toISOString(); data.updatedAt = new Date().toISOString();
      data.photoId = null;
      if(Array.isArray(r.variants)) data.variants = r.variants;
      if(r.nutrition && Array.isArray(r.nutrition.items)) data.nutrition = r.nutrition;
      if(r.baseName) data.baseName = r.baseName;
      if(typeof r.photoData === 'string' && r.photoData.startsWith('data:image/')){
        try{ const blob = await (await fetch(r.photoData)).blob(); const up = await S.assets.upload(await downscale(new File([blob], 'foto.jpg', {type: blob.type}), 1600)); data.photoId = up.id; }catch(e){}
      } else if(isUuid(r.id) && r.photoId && String(r.photoId).includes('/')) data.photoId = r.photoId;
      await S.db.collection('recipes').doc(id).set(data); n++;
    }
    toast(n === 1 ? '1 ricetta importata' : n + ' ricette importate');
  }catch(e){ toast('File non valido: scegli un backup del ricettario (.json)'); }
}

function setTab(tab, fromHash){
  if(!['ricette','menu','cosa','spesa'].includes(tab)) tab = 'ricette';
  S.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  $('#tabInd').style.setProperty('--ti', ['ricette','menu','cosa','spesa'].indexOf(tab));
  $('#viewRecipes').classList.toggle('hidden', tab !== 'ricette');
  $('#viewPlan').classList.toggle('hidden', tab !== 'menu');
  $('#viewShop').classList.toggle('hidden', tab !== 'spesa');
  $('#viewPantry').classList.toggle('hidden', tab !== 'cosa');
  $('#recipeTools').classList.toggle('hidden', tab !== 'ricette');
  $('#fabs').classList.toggle('hidden', tab !== 'ricette');
  if(!fromHash){ try{ history.replaceState(null, '', tab === 'ricette' ? location.pathname + location.search : '#' + tab); }catch(e){ try{ location.hash = tab === 'ricette' ? '' : tab; }catch(x){} } }
  if(tab === 'menu') renderPlan();
  if(tab === 'spesa') renderShop();
  if(tab === 'cosa') renderComposer();
  window.scrollTo(0, 0);
}

/* ---------- Salvataggio coalescente (una scrittura alla volta) ---------- */
function createSync(){ return {dirty:false, saving:false, t:null, pending:null}; }
function scheduleWrite(sync, path, body){
  sync.pending = {path, body: JSON.parse(JSON.stringify(body))}; sync.dirty = true;
  clearTimeout(sync.t); sync.t = setTimeout(() => flushSync(sync), 350);
}
async function flushSync(sync){
  clearTimeout(sync.t);
  if(sync.saving || !S.db) return;
  sync.saving = true;
  while(sync.dirty){
    sync.dirty = false; const {path, body} = sync.pending;
    try{ await S.db.doc(path).set(body); }
    catch(e){ toast(e && e.code === 'quota_exceeded' ? 'Spazio esaurito.' : 'Salvataggio non riuscito: riprova tra poco.'); }
  }
  sync.saving = false;
}
const busyFor = (sync, path) => (sync.dirty || sync.saving) && sync.pending && sync.pending.path === path;
const shopSync = createSync(), planSync = createSync();

function aisleOf(name){ const ce = canon(name); if(ce) return ce.a; const n = String(name || '').toLowerCase(); for(const [a, re] of AISLE_RULES) if(re.test(n)) return a; return 'Altro'; }
const UCLASS = {g:['g',1], kg:['g',1000], mg:['g',.001], ml:['ml',1], cl:['ml',10], dl:['ml',100], l:['ml',1000]};
function normName(n){ return String(n || '').toLowerCase().replace(/\s+/g,' ').trim(); }
function toShopItem(p, factor, from){
  let qty = p.qty != null ? (p.qtyMax ?? p.qty) * (factor || 1) : null, unit = p.unit || '';
  if(qty != null && UCLASS[unit]){ qty = qty * UCLASS[unit][1]; unit = UCLASS[unit][0]; }
  return {name: p.name, qty, unit, note: p.note || '', from: from ? [from] : [], aisle: aisleOf(p.name)};
}
function shopKey(it){ return normName(it.name) + '|' + (it.unit === 'q.b.' ? '' : it.unit); }
function mergeItems(list, it){
  const k = shopKey(it); const ex = list.find(x => !x.checked && shopKey(x) === k);
  if(ex){
    if(it.qty != null) ex.qty = (ex.qty || 0) + it.qty;
    if(ex.unit === 'q.b.' && it.unit && it.unit !== 'q.b.') ex.unit = it.unit;
    (it.from || []).forEach(f => { if(!ex.from.includes(f)) ex.from.push(f); });
    return list;
  }
  list.push(Object.assign({id: uuid(), checked:false}, it));
  return list;
}
function fmtShopQty(it){
  if(it.unit === 'q.b.') return 'q.b.';
  if(it.qty == null) return '';
  let q = it.qty, u = it.unit;
  if(u === 'g' && q >= 1000){ q = q/1000; u = 'kg'; }
  if(u === 'ml' && q >= 1000){ q = q/1000; u = 'l'; }
  const lab = unitLabel(u, q);
  return fmtQty(q, u) + (lab ? ' ' + lab : '');
}
function recipeItems(r, servings){

  const base = Number(r.servings) || null; const factor = base && servings ? servings / base : 1;
  return (r.ingredients || []).map(i => typeof i === 'string' ? parseIngredient(i) : (i.group || i.name != null ? i : parseIngredient(i.text))).filter(p => p && !p.group && p.name).map(p => toShopItem(p, factor, r.title));
}

const DAYS = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];

function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function weekLabel(mon){

let planUnsub = null;
function subscribePlan(){
  if(!S.db) return;

  S.planKey = key; S.plan = {slots:{}}; S.planLoaded = false; renderPlan();

    if(S.planKey !== key || busyFor(planSync, path)) return;
    S.plan = {slots: (snap.exists && snap.data().slots) ? JSON.parse(JSON.stringify(snap.data().slots)) : {}};

function savePlan(){ scheduleWrite(planSync, 'plans/' + S.planKey, {slots: S.plan.slots, weekStart: S.planKey, updatedAt: new Date().toISOString()}); renderPlan(); updateDigest(); }
async function addToPlan(weekKey, slot, entry){
  if(weekKey === S.planKey){ (S.plan.slots[slot] = S.plan.slots[slot] || []).push(entry); savePlan(); return; }

    const ref = S.db.doc('plans/' + weekKey); const snap = await ref.get();

function setupDictation(d){

    const ta = document.getElementById('ai_txt'); if(!ta) return;

  d.onState(({state, reason}) => {
    S.dictState = state;
    const b = document.getElementById('dict_btn'); const st = document.getElementById('ai_status');
    if(b){ const on = state !== 'idle'; b.classList.toggle('on', on); b.innerHTML = on ? '<span class="dot"></span> Ferma' : micIcon + ' ' + (document.getElementById('ai_txt') && document.getElementById('ai_txt').value ? 'Continua a dettare' : 'Inizia a dettare'); }
    if(state === 'idle' && reason && st){
      if(reason === 'not_granted') st.textContent = 'Microfono non autorizzato: puoi scrivere nel riquadro o usare il microfono della tastiera.';
      else if(reason === 'unavailable'){ st.textContent = 'La dettatura non è disponibile qui: usa il microfono della tastiera.'; b && b.classList.add('hidden'); }
      else if(reason === 'rate_limited') st.textContent = 'Troppe dettature in corso: riprova tra poco.';
      else if(reason === 'upstream_error') st.textContent = 'Il microfono non ha risposto. Riprova.';
    }
  });
}

/* --- dettatura con il riconoscimento vocale del browser (Chrome, Safari, Edge) --- */
function makeDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  let rec = null, state = 'idle', wanted = false, lastErr = null, stopWaiters = [];
  const hP = [], hF = [], hS = [];
  const setState = (s, reason) => { state = s; hS.forEach(h => h(reason ? {state:s, reason} : {state:s})); };
  const make = () => {
    rec = new SR(); rec.lang = 'it-IT'; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => { if(state !== 'listening') setState('listening'); };
    rec.onresult = e => {
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal){ const t = r[0].transcript.trim(); if(t) hF.forEach(h => h({text: ' ' + t})); }
        else interim += r[0].transcript;
      }
      hP.forEach(h => h({text: interim}));
    };
    rec.onerror = e => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ lastErr = 'not_granted'; wanted = false; }
      else if(e.error === 'no-speech' || e.error === 'aborted'){ /* riparte da sola */ }
      else { lastErr = 'upstream_error'; wanted = false; }
    };
    rec.onend = () => {
      hP.forEach(h => h({text: ''}));
      if(wanted && !lastErr && !document.hidden){ try{ rec.start(); return; }catch(x){} }
      const reason = lastErr || 'stopped'; lastErr = null; wanted = false;
      setState('idle', reason); stopWaiters.splice(0).forEach(f => f());
    };
  };
  return {
    start(){ wanted = true; lastErr = null; if(!rec) make(); if(state === 'idle') setState('starting'); try{ rec.start(); }catch(e){} return Promise.resolve(); },
    stop(){ if(state === 'idle') return Promise.resolve(); wanted = false; return new Promise(res => { stopWaiters.push(res); setState('finishing'); try{ rec.stop(); }catch(e){ res(); } setTimeout(res, 1500); }); },
    active(){ return state !== 'idle'; },
    onPartial(h){ hP.push(h); }, onFinal(h){ hF.push(h); }, onState(h){ hS.push(h); }
  };
}

/* --- messaggi di errore dell'assistente AI --- */
function aiErrorText(e){
  const c = e && e.code;
  if(c === 'limit_user') return 'Hai usato tutte le richieste all\'AI di questo mese' + (e.limit ? ' (' + e.limit + ')' : '') + '. Si azzerano il 1° del mese.';
  if(c === 'limit_total') return 'Il servizio ha raggiunto il limite mensile di richieste all\'AI. Si azzera il 1° del mese.';
  if(c === 'missing_api_key') return 'L\'assistente AI non è al momento disponibile. Riprova più tardi.';
  if(c === 'page_unreachable' || c === 'bad_url') return 'Impossibile aprire quella pagina (il sito potrebbe bloccare l\'accesso). Incolla il testo o allega uno screenshot.';
  if(c === 'rate_limited') return 'L\'assistente AI è molto richiesto in questo momento: riprova tra qualche minuto.';
  if(c === 'ai_failed') return 'Nessun servizio AI ha risposto in questo momento: riprova tra poco.';
  if(c === 'offline') return 'Sembra che tu sia offline: controlla la connessione e riprova.';
  if(c === 'not_signed_in') return 'La sessione è scaduta: esci e rientra.';
  if(c === 'invalid_json') return 'L\'assistente ha risposto in modo inatteso: riprova.';
  if(c === 'timeout') return 'La richiesta sta richiedendo troppo tempo: riprova tra poco.';
  if(c === 'too_many_jobs') return 'Hai già alcune richieste in preparazione: aspetta che finiscano.';
  if(c === 'cancelled') return '';
  return 'Si è verificato un errore. Riprova tra poco.' + (e && e.detail ? ' (' + String(e.detail).slice(0, 120) + ')' : '');
}

async function checkReadyJobs(){
  if(!store || !BOOT.started || !BOOT.book || recovering || S.edit || document.hidden) return;
  recovering = true;
  try{
    const jobs = await store.pendingJobs();
    for(const j of jobs){
      if(S.waitingJobs.has(j.id) || j.status === 'pending') continue;
      if(j.action === 'nutrition' && j.status === 'done' && j.meta && j.meta.recipeId){
        store.markJobSeen(j.id).catch(() => {});

      const d = normDraft(j.result); if(j.photo_path) d.photoId = j.photo_path;

      const ok = await askBox('Ricetta pronta', '«' + (d.title || 'Nuova ricetta') + '» è stata preparata mentre eri via. Vuoi aprirla per controllarla e salvarla?', 'Apri');

}

const PUSH = {supported: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window, sub: null, checked: false};
const WEEKDAYS = [[1, 'Lunedì'], [2, 'Martedì'], [3, 'Mercoledì'], [4, 'Giovedì'], [5, 'Venerdì'], [6, 'Sabato'], [7, 'Domenica']];
function notifyDefaults(){ return {timer: true, ai: true, menu: {on: true, time: '20:30'}, weekly: {on: true, day: 4, time: '19:00'}}; }
function N(){ if(!S.notify) S.notify = notifyDefaults(); return S.notify; }
const b64uToU8 = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

async function swReg(){ if(!PUSH.supported) return null; try{ return await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 4000))]); }catch(e){ return null; } }

  clearTimeout(notifyT); notifyT = setTimeout(() => { store && store.saveNotify(n).catch(e => toast('Impossibile salvare le preferenze delle notifiche. Riprova più tardi.')); }, 600);

async function enablePush(){
  if(!PUSH.supported){ toast('Questo browser non supporta le notifiche.'); return; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ toast(perm === 'denied' ? 'Notifiche bloccate: sbloccale da Chrome (lucchetto accanto all\'indirizzo → Notifiche).' : 'Permesso non concesso.'); renderSettings(); return; }
  try{
    const reg = await swReg(); if(!reg) throw {code: 'sw'};
    const {publicKey} = await store.fn({action: 'push_key'});
    let sub = await reg.pushManager.getSubscription();
    if(sub && sub.options && sub.options.applicationServerKey){
      const a = new Uint8Array(sub.options.applicationServerKey), b = b64uToU8(publicKey);
      if(a.length !== b.length || a.some((x, i) => x !== b[i])){ await sub.unsubscribe(); sub = null; }
    }
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uToU8(publicKey)});
    const res = await store.fn({action: 'push_subscribe', subscription: sub.toJSON(), device: deviceName()});
    PUSH.sub = sub; S.pushOn = true;
    if(!S.notify) S.notify = notifyDefaults();
    saveNotifySoon(); updateDigest(true); tPushResync();
    toast(res.cron === false ? 'Notifiche attive. I promemoria programmati non sono ancora disponibili.' : 'Notifiche attive su questo dispositivo');
  }catch(e){
    toast(e && e.code === 'sw' ? 'Le notifiche non sono disponibili da questo indirizzo.' : e && e.code === 'not_signed_in' ? 'Accedi di nuovo e riprova.' : 'Impossibile attivare le notifiche. Riprova più tardi.');
  }

}

/* --- timer: notifica programmata sul server alla scadenza --- */
function tPushWanted(){ return !!(store && S.pushOn && (!S.notify || S.notify.timer !== false)); }
function tPushSync(t){
  if(!tPushWanted() || !t) return;

  else store.cancelPush(ref).catch(() => {});
}
function tPushCancel(id){ if(store && S.pushOn) store.cancelPush('timer-' + id).catch(() => {}); }
function tPushResync(){ T.list.forEach(t => { if(tPushWanted()) tPushSync(t); else tPushCancel(t.id); }); }

let digestT = null;
function updateDigest(force){
  const n = S.notify; if(!n || !n.weekly || !n.weekly.on || !store) return;
  const thisWeek = isoDate(mondayOf(new Date()));
  if(S.planKey !== thisWeek || !S.planLoaded) return;

  if(!ws.length) return;
  const under = ws.filter(x => x.st === 'under').map(x => x.w.name + ' (' + x.c + ' su ' + x.w.min + ')');
  const over = ws.filter(x => x.st === 'over').map(x => x.w.name + ' (' + x.c + ', max ' + x.w.max + ')');
  const text = (under.length ? 'Mancano ancora: ' + under.join(', ') + '.' : 'Finora tutto in linea con le frequenze.') + (over.length ? ' Già oltre: ' + over.join(', ') + '.' : '');
  if(!force && n.digest && n.digest.week === thisWeek && n.digest.text === text) return;

   Integratori: facoltativi, con promemoria (orari, giorni, dose)
   ==================================================================== */
const DAY_SHORT = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];
function normSupps(list){
  return (Array.isArray(list) ? list : []).map(s => {
    if(!s || !String(s.name || '').trim()) return null;
    const times = (Array.isArray(s.times) ? s.times : []).map(t => {
      if(typeof t === 'string') t = {time: t};
      const m = String(t && t.time || '').match(/^(\d{1,2})[:.](\d{2})$/); if(!m) return null;
      const hh = Math.min(23, Number(m[1])), mm = Math.min(59, Number(m[2]));
      const days = Array.isArray(t.days) ? [...new Set(t.days.map(Number).filter(d => d >= 1 && d <= 7))].sort() : [];
      return {time: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'), days: days.length === 7 ? [] : days};
    }).filter(Boolean);

async function settingsAction(btn){

    try{
      const code = await store.books.invite(b.id);

        (m, close) => { m.querySelector('[data-a=x]').onclick = close; m.querySelector('[data-a=cp]').onclick = async () => { try{ await navigator.clipboard.writeText(text); toast('Link copiato'); close(); }catch(x){ m.querySelector('input').select(); } }; });
    }catch(e){ toast('Impossibile creare l\'invito.'); }
    return;
  }

  if(a === 'name'){ const n = await promptBox('Il tuo nome', 'Nome', BOOT.profile && BOOT.profile.display_name, 'Salva'); if(!n) return; await store.setName(n); BOOT.profile = await store.profile(); openSettings(); return; }
  if(a === 'pw'){ closeSettings(); showAuth('newpw'); return; }
  if(a === 'logout'){ if(!(await confirmBox('Uscire dall\'account?', 'Su questo dispositivo dovrai accedere di nuovo. Le ricette restano salvate.', 'Esci'))) return; try{ Object.keys(localStorage).filter(k => k.startsWith('cache.') || k === 'book').forEach(k => localStorage.removeItem(k)); }catch(e){} await store.auth.signOut(); location.reload(); return; }
