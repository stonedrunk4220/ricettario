<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio ricettario</title>
<meta name="theme-color" content="#2E6A4E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="description" content="Il tuo ricettario personale: ricette, menù della settimana e lista della spesa, anche in famiglia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ricettario">
<script src="config.js"></script>
<script src="ingredienti.js"></script>
<script>try{var a=localStorage.getItem("accent");if(a&&a!=="pomodoro")document.documentElement.setAttribute("data-accent",a)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una colonna su telefono, griglia su desktop; dettaglio ed editor come fogli a tutto schermo. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#1B231F; --muted:#5C6961; --line:#DCE1D8;
  --accent:#D93A22; --accent-ink:#FFFFFF; --accent-soft:#FBE4DE; --spice:#B87A0C; --danger:#B3261E;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#19201C; --ink:#E6ECE8; --muted:#98A69E; --line:#2B3530;
    --accent:#FF7A5C; --accent-ink:#200A05; --accent-soft:#3A1D17; --spice:#E4B24A; --danger:#F08079; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201C; --ink:#E6ECE8; --muted:#98A69E; --line:#2B3530;
  --accent:#FF7A5C; --accent-ink:#200A05; --accent-soft:#3A1D17; --spice:#E4B24A; --danger:#F08079; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;padding:0;border-radius:50%}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:0 auto;padding:14px 16px 12px;display:grid;gap:12px}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-row h1{font-size:26px;flex:1}
.brand-row h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{border:0;background:transparent;outline:none;padding:10px 0;flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:1100px;margin:0 auto;padding:16px 16px 170px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.banner.warn{background:color-mix(in srgb,var(--spice) 18%,var(--surface))}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}}

.card{display:grid;grid-template-columns:92px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;min-height:92px}
.card:hover{border-color:var(--muted)}
@media (min-width:700px){.card{grid-template-columns:1fr;grid-template-rows:160px auto}}
.thumb{background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;font-weight:700;color:var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card-body{padding:12px 14px;display:grid;gap:4px;align-content:start}
.card-title{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.fav{color:var(--spice)}

.empty{text-align:center;padding:48px 16px;display:grid;gap:14px;justify-items:center}
.empty p{color:var(--muted);max-width:42ch;margin:0}

.fab{box-shadow:0 6px 20px rgba(0,0,0,.18);padding:14px 20px;font-size:16px}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.sheet-bar-inner{max-width:780px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:6px}
.sheet-bar-inner .spacer{flex:1}
.sheet-content{max-width:780px;margin:0 auto;padding:16px 16px 140px;display:grid;gap:22px}

.hero{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--accent-soft)}
.hero img{width:100%;height:100%;object-fit:cover}
.d-title{font-size:32px}
.d-sub{color:var(--muted);margin-top:4px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.pill b{font-weight:700}
.pill.diff-facile{border-color:var(--ok, #2F8F5B);color:var(--ok, #2F8F5B)}
.pill.diff-media{border-color:var(--spice);color:var(--spice)}
.pill.diff-difficile{border-color:var(--danger);color:var(--danger)}
.section h2{font-size:21px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section h2 .grow{flex:1}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:var(--body);font-size:15px;font-weight:600}
.stepper button{border:0;background:transparent;width:36px;height:36px;cursor:pointer;font-size:20px;line-height:1}
.stepper span{min-width:92px;text-align:center;font-variant-numeric:tabular-nums}

.ing-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing-list li{border-top:1px solid var(--line)}
.ing-list li:first-child{border-top:0}
.ing-list label{display:flex;gap:12px;align-items:baseline;padding:11px 14px;cursor:pointer}
.ing-list input{accent-color:var(--accent);width:18px;height:18px;flex:none;transform:translateY(3px)}
.ing-q{font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;flex:none}
.ing-list li.done .ing-txt,.ing-list li.done .ing-q{text-decoration:line-through;color:var(--muted)}
.ing-group{padding:12px 14px 6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ing-note{color:var(--muted)}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:700;font-size:18px;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.step-text{white-space:pre-wrap}
.step-actions{margin-top:8px}
.notes{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--spice);border-radius:var(--r);padding:14px;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

/* Editor */
.field{display:grid;gap:6px}
.field > label,.lbl{font-weight:600;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:70px}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-prev{width:96px;height:72px;border-radius:10px;background:var(--accent-soft);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.line .parsed{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;padding-left:4px;margin-top:-2px}
.parsed span{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 6px;font-weight:600}
.parsed span.grp{background:color-mix(in srgb,var(--spice) 20%,transparent);color:var(--spice)}
.line-tools{display:flex;gap:2px}
.line-tools button{width:34px;height:40px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center}
.line-tools button:hover{background:var(--surface);color:var(--ink)}
.step-line{display:grid;grid-template-columns:1fr auto;gap:6px}
.step-line .timer-in{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);grid-column:1/-1}
.step-line .timer-in input{width:80px;padding:6px 8px}
.save-bar{position:sticky;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line)}
.save-bar-inner{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;justify-content:flex-end}

/* Modals */
.modal-back{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-back{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px;display:grid;gap:14px;max-height:92%;overflow-y:auto}
@media (min-width:640px){.modal{border-radius:20px}}
.modal h3{font-size:22px}
.modal p{margin:0;color:var(--muted)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Timers + toast */
.timers{position:fixed;left:12px;bottom:12px;z-index:30;display:grid;gap:8px;max-width:calc(100% - 24px)}
.timer{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.timer b{font-size:18px;min-width:58px}
.timer .t-lbl{font-size:13px;opacity:.8;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:0;background:rgba(255,255,255,.15);color:inherit;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600}
.timer.done{background:var(--spice);color:#1B1300;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:50;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* Cooking mode */
.cook{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column}
.cook-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cook-top .t{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-progress{height:4px;background:var(--line)}
.cook-progress div{height:100%;background:var(--accent);transition:width .25s}
.cook-body{flex:1;overflow-y:auto;padding:24px 20px;max-width:780px;width:100%;margin:0 auto;display:grid;align-content:start;gap:18px}
.cook-num{font-family:var(--display);color:var(--accent);font-weight:700;font-size:16px;letter-spacing:.04em}
.cook-text{font-size:clamp(22px,4.6vw,30px);line-height:1.4;white-space:pre-wrap}
.cook-nav{display:flex;gap:10px;padding:12px 16px 18px;max-width:780px;width:100%;margin:0 auto}
.cook-nav .btn{flex:1;padding:14px}
/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabbar-inner{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;border:0;background:transparent;padding:8px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--spice);color:#1B1300;font-size:11px;border-radius:999px;padding:0 6px;line-height:17px;font-variant-numeric:tabular-nums}
.fabs{position:fixed;right:16px;bottom:78px;z-index:6;display:flex;gap:10px;align-items:center}
.fabs .fab{position:static}
.fab-mic{width:52px;height:52px;padding:0;border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.timers{bottom:78px}

/* Menu */
.view-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.view-head .ttl{flex:1;min-width:0}
.view-head h2{font-size:24px}
.view-head .sub{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.days{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.days{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.day.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.day-name{font-family:var(--display);font-weight:700;font-size:17px;display:flex;align-items:baseline;gap:8px}
.day-name small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px}
.day-name .now{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.slot{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.slot-lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:7px}
.entries{display:flex;flex-wrap:wrap;gap:6px}
.entry{display:inline-flex;align-items:center;background:var(--accent-soft);border-radius:10px;overflow:hidden;max-width:100%}
.entry button{border:0;background:transparent;cursor:pointer;padding:6px 4px 6px 10px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.entry button small{font-weight:500;color:var(--muted)}
.entry button.rm{padding:6px 8px;color:var(--muted);font-weight:400}
.entry.free{background:transparent;border:1px dashed var(--line)}
.entry.gone button:first-child{color:var(--muted);text-decoration:line-through}
.add-slot{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600}
.add-slot:hover{border-color:var(--accent);color:var(--accent)}
.pick-list{display:grid;gap:6px;max-height:260px;overflow-y:auto}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick small{color:var(--muted)}
.days-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days-pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;cursor:pointer;font-size:13px;font-weight:600;display:grid;line-height:1.2}
.days-pick button small{font-weight:500;color:var(--muted)}
.days-pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days-pick button[aria-pressed="true"] small{color:inherit}

/* Spesa */
.add-row{display:flex;gap:8px;margin-bottom:16px}
.add-row .inp{flex:1;min-width:0}
.aisle{margin-bottom:16px}
.aisle h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;margin:0 0 6px 2px}
.shop-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.shop-list li{display:flex;align-items:center;border-top:1px solid var(--line)}
.shop-list li:first-child{border-top:0}
.shop-list label{flex:1;display:flex;gap:12px;align-items:baseline;padding:11px 4px 11px 14px;cursor:pointer;min-width:0}
.shop-list input{accent-color:var(--accent);width:20px;height:20px;flex:none;transform:translateY(4px)}
.shop-list .sq{font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;flex:none}
.shop-list .sn{min-width:0}
.shop-list .sn small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-list li.done .sq,.shop-list li.done .sn > span{text-decoration:line-through;color:var(--muted)}
.shop-list .rm{border:0;background:transparent;color:var(--muted);width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.cand{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:46vh;overflow-y:auto}
.cand label{display:flex;gap:10px;align-items:baseline;padding:7px 4px;cursor:pointer}
.cand input{accent-color:var(--accent);width:18px;height:18px;flex:none;transform:translateY(3px)}
.cand b{font-variant-numeric:tabular-nums;min-width:62px;display:inline-block}

/* Dettatura e bozza */
.mic-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mic-btn.on{background:var(--danger);border-color:var(--danger);color:#fff}
.mic-btn.on .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.partial{color:var(--muted);font-style:italic;min-height:1.5em}

/* ===== Look v2: vetro, profondità, movimento ===== */
:root{
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.78); --glass-line: rgba(255,255,255,.75);
  --edge: rgba(27,35,31,.08); --shadow: 0 1px 2px rgba(20,30,25,.05), 0 10px 30px -12px rgba(20,40,30,.22);
  --blob1: color-mix(in srgb, var(--accent) 24%, transparent); --blob2: rgba(224,165,38,.24); --blob3: rgba(46,143,91,.14);
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --glass: rgba(28,36,32,.55); --glass-strong: rgba(26,33,29,.82); --glass-line: rgba(255,255,255,.07);
    --edge: rgba(255,255,255,.06); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
    --blob1: color-mix(in srgb, var(--accent) 18%, transparent); --blob2: rgba(228,178,74,.12); --blob3: rgba(108,203,146,.08);
  }
}
:root[data-theme="dark"]{
  --glass: rgba(28,36,32,.55); --glass-strong: rgba(26,33,29,.82); --glass-line: rgba(255,255,255,.07);
  --edge: rgba(255,255,255,.06); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
  --blob1: color-mix(in srgb, var(--accent) 18%, transparent); --blob2: rgba(228,178,74,.12); --blob3: rgba(108,203,146,.08);
}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 32% at 12% 8%, var(--blob1), transparent 70%),
    radial-gradient(34% 30% at 92% 18%, var(--blob2), transparent 70%),
    radial-gradient(40% 36% at 70% 96%, var(--blob3), transparent 70%),
    radial-gradient(30% 28% at 4% 78%, var(--blob2), transparent 70%);
  animation: drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-2%,2%,0) scale(1.06)}}
header.top, .tabbar, .sheet-bar, .save-bar, .modal, .fab-mic{
  -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5)}
header.top{background:color-mix(in srgb,var(--bg) 55%,transparent);border-bottom-color:var(--edge)}
.tabbar{background:var(--glass-strong);border-top:1px solid var(--edge);box-shadow:0 -8px 30px -18px rgba(0,0,0,.25)}
.sheet,.cook{background:radial-gradient(60% 40% at 0% 0%, var(--blob1), transparent 70%), radial-gradient(50% 35% at 100% 10%, var(--blob2), transparent 70%), var(--bg)}
#sheetEdit .sheet-content{padding-bottom:28px}
.sheet-bar{background:color-mix(in srgb,var(--bg) 50%,transparent);border-bottom-color:var(--edge)}
.save-bar{background:var(--glass-strong);border-top-color:var(--edge)}
.card,.ing-list,.steps li,.day,.shop-list,.notes,.pick{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.search,.chip,.pill,.stepper,.seg,.inp,.days-pick button,.btn:not(.primary):not(.ghost){background:var(--glass);border-color:var(--glass-line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.inp:focus{background:var(--glass-strong);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.search:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.modal{background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal-back{background:rgba(10,16,13,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadeIn .2s ease}
.modal{animation:pop .32s var(--ease)}
@media (max-width:639px){.modal{animation:slideUp .34s var(--ease)}}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff) 0%,var(--accent) 100%);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent), inset 0 1px 0 rgba(255,255,255,.25)}
.btn{transition:transform .15s var(--ease), box-shadow .2s, background-color .2s, border-color .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.chip{transition:background-color .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.fab{border-radius:999px}
.fab-mic{background:var(--glass-strong) !important}

/* Card */
.card{transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 20px 40px -16px rgba(20,40,30,.35)}
.card:active{transform:scale(.985)}
.thumb{background:linear-gradient(135deg,var(--tint,var(--accent-soft)),color-mix(in srgb,var(--tint,var(--accent-soft)) 40%,transparent));color:rgba(255,255,255,.95);text-shadow:0 2px 10px rgba(0,0,0,.18)}
.thumb img{transition:transform .5s var(--ease)}
.card:hover .thumb img{transform:scale(1.06)}
.stagger > *{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
@keyframes slideUp{from{transform:translateY(100%)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px)}}

/* Viste e fogli */
main > section:not(.hidden){animation:fadeRise .3s var(--ease)}
@keyframes fadeRise{from{opacity:0;transform:translateY(6px)}}
.sheet:not(.hidden),.cook:not(.hidden){animation:sheetIn .36s var(--ease)}
.hero{position:relative;aspect-ratio:4/3;max-height:420px;width:100%;box-shadow:var(--shadow)}
@media (min-width:700px){.hero{aspect-ratio:16/9}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.62))}
.hero-cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.hero-cap .d-title{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero-cap .d-sub{color:rgba(255,255,255,.85)}
.steps li{transition:transform .2s var(--ease)}
.ing-list label,.shop-list label{transition:background-color .2s}
.ing-list label:hover,.shop-list label:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ing-txt,.ing-q,.shop-list .sq,.shop-list .sn > span{transition:color .25s}
input[type=checkbox]{transition:transform .15s var(--ease)}
input[type=checkbox]:active{transform:scale(.85)}

/* Tab bar con indicatore che scorre */
.tabbar-inner{position:relative}
.tab-ind{position:absolute;top:6px;bottom:6px;left:0;width:calc(100% / 3);padding:0 14px;pointer-events:none;transform:translateX(calc(var(--ti,0) * 100%));transition:transform .4s var(--ease)}
.tab-ind::before{content:"";display:block;height:100%;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tabbar button{z-index:1;transition:color .25s}
.tabbar button[aria-current="page"]::before{display:none}
.tabbar button svg{transition:transform .3s var(--ease)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}

/* Toast e timer */
.toast{animation:toastIn .35s var(--ease);background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
.timer{animation:pop .3s var(--ease);background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* Editor: campi cambiati da Claude */
.inp.chg{border-color:var(--spice);box-shadow:0 0 0 3px color-mix(in srgb,var(--spice) 22%,transparent);animation:glow 1.6s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 8px color-mix(in srgb,var(--spice) 35%,transparent)}}
.draft-banner{animation:rise .4s var(--ease);background:color-mix(in srgb,var(--spice) 14%,var(--glass))}
.ai-tabs button{font-size:13.5px}
.kb-hint{display:flex;gap:8px;align-items:flex-start;color:var(--ink) !important;background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:12px;padding:10px 12px}
.photo-prev{position:relative}
.photo-prev .count{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:6px;padding:0 6px}
.mic-btn.on{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 50%,transparent);animation:ring 1.6s infinite}
@keyframes ring{70%{box-shadow:0 0 0 12px transparent}}
.day{transition:transform .2s var(--ease)}
.entry{animation:pop .25s var(--ease)}
.lines > *{animation:fadeIn .2s ease}
.empty h2{font-size:24px}

.file-btn{position:relative;overflow:hidden}
.file-btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.attach-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.atts{display:grid;gap:6px}
.atts:empty{display:none}
.att{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;padding:6px 6px 6px 8px;animation:pop .25s var(--ease)}
.att img,.att .att-ic{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.att .att-ic{display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
.att .spin{margin:11px}
.att-t{flex:1;min-width:0;display:grid;line-height:1.3}
.att-t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-t small{color:var(--muted);font-size:12.5px}
.att.err .att-t small{color:var(--danger)}
.att button{border:0;background:transparent;color:var(--muted);width:36px;height:36px;cursor:pointer;flex:none}
/* ===== Timer integrato (dock a scomparsa) ===== */
.tdock{position:fixed;left:0;right:0;bottom:var(--dock-b,76px);z-index:32;display:flex;justify-content:center;pointer-events:none;padding:0 12px;transition:bottom .3s var(--ease)}
.tdock[data-state="hidden"]{display:none}
.tdock-compact{pointer-events:auto;width:100%;max-width:520px;display:flex;align-items:center;gap:12px;border:1px solid var(--glass-line);background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-radius:20px;padding:8px 14px 8px 8px;box-shadow:0 14px 40px -14px rgba(0,0,0,.45);cursor:pointer;color:var(--ink);text-align:left;touch-action:none;animation:dockIn .4s var(--ease)}
@keyframes dockIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
.tdock[data-state="open"] .tdock-compact{display:none}
.tring{width:40px;height:40px;flex:none;position:relative}
.tring svg{width:40px;height:40px;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:4}
.tring .bg{stroke:color-mix(in srgb,var(--accent) 18%,transparent)}
.tring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.tring .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.tring .ic svg{width:18px;height:18px;transform:none}
.tc-main{flex:1;min-width:0;display:grid;line-height:1.2}
.tc-time{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tc-lbl{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-more{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px}
.tc-up{color:var(--muted);display:flex}
.tdock.has-done .tdock-compact{background:color-mix(in srgb,var(--spice) 30%,var(--glass-strong));animation:dockIn .4s var(--ease), nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.tdock.has-done .tring .fg{stroke:var(--spice)}
.tdock-panel{pointer-events:auto;position:fixed;left:0;right:0;bottom:0;z-index:2;margin:0 auto;max-width:560px;max-height:78%;display:flex;flex-direction:column;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--glass-line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .38s var(--ease);visibility:hidden}
.tdock[data-state="open"] .tdock-panel{transform:translateY(0);visibility:visible}
.tdock-panel.dragging{transition:none}
.tdock-scrim{pointer-events:auto;position:fixed;inset:0;background:rgba(8,12,10,.28);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.tdock[data-state="open"] .tdock-scrim{opacity:1;visibility:visible}
.tgrab{padding:10px 0 4px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.tgrab span{width:42px;height:5px;border-radius:999px;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.tp-head{display:flex;align-items:center;gap:8px;padding:2px 18px 10px;touch-action:none}
.tp-head h3{flex:1;font-size:21px}
.tp-body{overflow-y:auto;padding:0 14px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;overscroll-behavior:contain}
.tlist,.tnew{min-width:0}
.tlist{display:grid;gap:10px}
.trow{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:12px 12px 12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;animation:pop .3s var(--ease)}
.trow .t-time{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.trow .t-lbl{font-size:13.5px;color:var(--muted);grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .t-bar{grid-column:1/-1;height:5px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);overflow:hidden}
.trow .t-bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s linear;transform-origin:left}
.trow .t-act{display:flex;gap:6px}
.trow .t-act button{border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;height:40px;min-width:40px;padding:0 12px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:4px}
.trow .t-act button:active{transform:scale(.94)}
.trow.paused .t-time{opacity:.55}
.trow.done{background:color-mix(in srgb,var(--spice) 22%,var(--glass));border-color:color-mix(in srgb,var(--spice) 50%,transparent)}
.trow.done .t-time{color:var(--spice)}
.trow.done .t-bar i{background:var(--spice)}
.tnew{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-top:4px}
.tnew .lbl{font-size:13px;color:var(--muted);font-weight:600}
.tpresets{display:flex;gap:6px;flex-wrap:wrap}
.tpresets button{border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.tcustom{display:flex;gap:8px}
.tcustom .inp{width:auto;flex:1;min-width:0;size:1}
.tempty{color:var(--muted);font-size:14px;text-align:center;padding:6px}
@media (prefers-reduced-motion: reduce){.tdock-panel,.tdock{transition:none}}
/* ===== App pubblicata: accesso, ricettari, impostazioni ===== */
body.locked{overflow:hidden}
header.top{padding-top:env(safe-area-inset-top)}

.auth{position:fixed;inset:0;z-index:60;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(50% 40% at 10% 10%, var(--blob1), transparent 70%), radial-gradient(45% 40% at 95% 25%, var(--blob2), transparent 70%), radial-gradient(50% 40% at 60% 100%, var(--blob3), transparent 70%), var(--bg)}

.set-list,.set-card{display:grid;gap:8px}

.set-row:active{transform:scale(.985)}

.set-row .grow,.set-line .grow,.members .grow{flex:1;min-width:0;display:grid;line-height:1.3}

.st-ok{--c:var(--ok)} .st-near{--c:var(--warn)} .st-out{--c:var(--bad)} .st-none{--c:var(--muted)}

.hc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hc-title{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--ok);flex:1}
.hc-meals{display:flex;gap:4px;flex-wrap:wrap}

:root[data-accent="basilico"][data-theme="dark"]{--accent:#72C097;--accent-ink:#0C1A12;--accent-soft:#1E3227}

.ac-list{display:none;position:absolute;left:12px;right:12px;top:62px;z-index:5;background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-line);border-radius:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.4);overflow:hidden;animation:pop .2s var(--ease)}

.pt-tools:empty{display:none}
.pt-opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pt-tol{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}

.pm-ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.pm-body{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.pm-title{border:0;background:transparent;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.2}
.pm-title:hover{color:var(--accent)}
.pm-body > small{color:var(--muted);font-size:13px}
.pm-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pc{font-size:12.5px;border-radius:999px;padding:2px 9px 2px 7px;display:inline-flex;align-items:center;gap:4px;font-weight:600}

.pc.ok::before{content:"✓"}
.pc.sub{color:var(--warn, #C98A12);background:color-mix(in srgb,var(--warn, #C98A12) 14%,transparent)}

.pc.miss{color:var(--bad, #C2412F);background:color-mix(in srgb,var(--bad, #C2412F) 12%,transparent)}
.pc.miss::before{content:"✗"}
.pt-ai{display:flex;justify-content:center;margin-top:18px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

function detectMinutes(text){

}

function fmtNum(q){

}

/* ====================================================================
   Healthy: piano alimentare personale e confronto con le ricette
   ==================================================================== */
const FOOD_GROUPS = [
  ['carboidrati', 'Carboidrati', 'pasta, riso, pane, patate'],
  ['proteine', 'Proteine', 'carne, pesce, uova, legumi'],
  ['latticini', 'Latticini', 'formaggi, latte, yogurt'],
  ['verdure', 'Verdure', 'verdure e ortaggi'],
  ['frutta', 'Frutta', 'frutta fresca'],
  ['grassi', 'Grassi', 'olio, burro, frutta secca'],
  ['zuccheri', 'Zuccheri', 'zucchero, miele, dolci']
];
const MACROS = [['kcal', 'Calorie', 'kcal'], ['carbs', 'Carboidrati', 'g'], ['protein', 'Proteine', 'g'], ['fat', 'Grassi', 'g']];
const MEAL_LIST = [['colazione', 'Colazione'], ['pranzo', 'Pranzo'], ['cena', 'Cena'], ['spuntino', 'Spuntino']];
const DEFAULT_MODE = {verdure: 'min', frutta: 'min', protein: 'min'};
function defaultHealth(){ return {enabled: false, tolerance: 10, defaultMeal: 'pranzo', meals: {}}; }
function H(){ return S.health || (S.health = defaultHealth()); }
function healthOn(){ return !!(S.health && S.health.enabled); }
const groupLabel = k => (FOOD_GROUPS.find(g => g[0] === k) || [k, k === 'altro' ? 'Altro' : k])[1];
const fmtG = v => (v >= 100 ? Math.round(v / 5) * 5 : Math.round(v)) + ' g';
const fmtMacro = (k, v) => k === 'kcal' ? Math.round(v) + ' kcal' : Math.round(v) + ' g';

/* --- varianti: la ricetta "effettiva" mostrata --- */
const VARIANT_FIELDS = ['servings', 'servingsUnit', 'prepMin', 'cookMin', 'restMin', 'difficulty', 'ingredients', 'steps', 'notes', 'nutrition'];
function effR(r, vid){
  if(!r) return r;
  const v = vid && (r.variants || []).find(x => x.id === vid);
  if(!v) return Object.assign({}, r, {variantId: null, variantName: null, nutrition: r.nutrition});
  const e = Object.assign({}, r);
  VARIANT_FIELDS.forEach(k => { e[k] = v[k] !== undefined ? v[k] : (k === 'nutrition' ? null : r[k]); });
  e.variantId = v.id; e.variantName = v.name;
  return e;
}
const curR = () => effR(getR(S.openId), S.variantId);
const titleWithVariant = r => r.title + (r.variantName ? ' (' + r.variantName + ')' : '');

/* --- valori nutrizionali --- */
function ingHash(r){
  const s = (r.ingredients || []).map(ingToText).join('\n');
  let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return String(h >>> 0);
}
function perPortion(r){
  const n = r && r.nutrition;
  if(!n || !Array.isArray(n.items)) return null;
  const serv = Number(r.servings) || 1;
  const groups = {}, macros = {kcal: 0, carbs: 0, protein: 0, fat: 0}, byIdx = new Map();
  n.items.forEach(it => {
    const g = FOOD_GROUPS.some(x => x[0] === it.group) ? it.group : 'altro';
    const grams = (Number(it.grams) || 0) / serv;
    groups[g] = (groups[g] || 0) + grams;
    MACROS.forEach(([k]) => { macros[k] += (Number(it[k]) || 0) / serv; });
    byIdx.set(Number(it.i), {group: g, grams});
  });
  return {groups, macros, byIdx, stale: n.hash !== ingHash(r), servings: Number(r.servings) || null, notes: n.notes || ''};
}
function evalTarget(v, t, tol){
  if(!t || !(Number(t.v) > 0)) return null;
  const lim = Number(t.v);
  if(t.mode === 'min'){ if(v >= lim) return 'ok'; if(v >= lim * (1 - tol / 100)) return 'near'; return 'out'; }
  if(v <= lim) return 'ok'; if(v <= lim * (1 + tol / 100)) return 'near'; return 'out';
}
function healthCheck(r, meal){
  const pp = perPortion(r); if(!pp) return null;
  const plan = (H().meals || {})[meal] || {}, tol = Number(H().tolerance ?? 10);
  const g = {}, m = {}, issues = [];
  FOOD_GROUPS.forEach(([k, label]) => {
    const t = plan.groups && plan.groups[k], v = pp.groups[k] || 0, st = evalTarget(v, t, tol);
    if(!st) return; g[k] = st;
    if(st !== 'ok') issues.push({st, txt: label + ' ' + (t.mode === 'min' ? '−' + fmtG(Number(t.v) - v) : '+' + fmtG(v - Number(t.v)))});
  });
  MACROS.forEach(([k, label]) => {
    const t = plan.macros && plan.macros[k], v = pp.macros[k] || 0, st = evalTarget(v, t, tol);
    if(!st) return; m[k] = st;
    if(st !== 'ok') issues.push({st, txt: label + ' ' + (t.mode === 'min' ? '−' : '+') + fmtMacro(k, Math.abs(v - Number(t.v)))});
  });
  const all = [...Object.values(g), ...Object.values(m)];
  const verdict = !all.length ? 'noplan' : all.includes('out') ? 'out' : all.includes('near') ? 'near' : 'ok';
  issues.sort((a, b) => (a.st === 'out' ? 0 : 1) - (b.st === 'out' ? 0 : 1));
  return {pp, g, m, verdict, plan, issues};
}
function mealFor(r){
  if(S.healthMeal) return S.healthMeal;
  if((r.category || '') === 'Colazione') return 'colazione';
  return H().defaultMeal || 'pranzo';
}
function healthCardHtml(r){
  if(!healthOn()) return '';
  const key = r.id + '|' + (r.variantId || ''), busy = S.analyzing && S.analyzing.has(key);
  const meal = mealFor(r), mealName = (MEAL_LIST.find(x => x[0] === meal) || ['', meal])[1];
  const planEmpty = !Object.keys(H().meals || {}).length;
  const head = '<div class="hc-head"><span class="hc-title">' + IC.leaf + ' Healthy</span><div class="hc-meals" role="group" aria-label="Confronta con il pasto">' + MEAL_LIST.map(([k, l]) => '<button data-hmeal="' + k + '" aria-pressed="' + (k === meal) + '">' + l + '</button>').join('') + '</div></div>';
  if(busy) return '<section class="hcard">' + head + '<div class="hc-wait"><span class="spin"></span> Calcolo i valori nutrizionali… (puoi continuare a usare l\'app)</div></section>';
  if(!r.nutrition) return '<section class="hcard">' + head + '<p class="hc-msg">Valori nutrizionali non ancora calcolati per questa ' + (r.variantName ? 'variante' : 'ricetta') + '.</p><div class="detail-actions"><button class="btn primary" data-act="analyze">' + IC.spark + ' Calcola con l\'AI</button></div></section>';
  const hc = healthCheck(r, meal); if(!hc) return '';
  const VERD = {ok: ['ok', 'In linea con il tuo piano'], near: ['near', 'Quasi in linea'], out: ['out', 'Fuori dal piano'], noplan: ['none', 'Nessun valore impostato per ' + mealName.toLowerCase()]};
  const [vc, vt] = VERD[hc.verdict];
  let h = '<section class="hcard v-' + vc + '">' + head +
    '<div class="hc-verdict"><span class="dot st-' + vc + '"></span><div><b>' + vt + '</b>' + (hc.issues.length ? '<small>' + hc.issues.slice(0, 4).map(x => esc(x.txt)).join(' · ') + '</small>' : hc.verdict === 'ok' ? '<small>' + mealName + ', per una porzione</small>' : '') + '</div></div>';
  if(hc.pp.stale) h += '<div class="hc-stale">Gli ingredienti sono cambiati dall\'ultimo calcolo. <button class="btn small" data-act="analyze">Ricalcola</button></div>';
  // gruppi
  const rows = FOOD_GROUPS.filter(([k]) => (hc.pp.groups[k] || 0) > 0.5 || (hc.plan.groups && hc.plan.groups[k] && Number(hc.plan.groups[k].v) > 0));
  h += '<div class="hc-groups">' + rows.map(([k, label]) => {
    const v = hc.pp.groups[k] || 0, t = hc.plan.groups && hc.plan.groups[k], st = hc.g[k] || 'none';
    const lim = t && Number(t.v) > 0 ? Number(t.v) : 0;

  }).join('') + '</div>';

/* --- calcolo con l'AI (in background, sopravvive allo standby) --- */
async function analyzeNutrition(recipeId, variantId, opts){
  opts = opts || {};
  const r0 = getR(recipeId), r = effR(r0, variantId); if(!r || !store) return;
  const lines = (r.ingredients || []).map(ingToText).filter(t => t.trim());
  if(!lines.length){ if(!opts.silent) toast('Aggiungi prima gli ingredienti.'); return; }
  S.analyzing = S.analyzing || new Set();
  const key = recipeId + '|' + (variantId || ''); if(S.analyzing.has(key)) return;
  S.analyzing.add(key); if(S.openId === recipeId) renderDetail();
  let jobId = null;
  try{
    const res = await store.ai({action: 'nutrition', ingredients: (r.ingredients || []).map(ingToText), servings: r.servings, title: titleWithVariant(r), meta: {recipeId, variantId: variantId || null, hash: ingHash(r)}}, {onJob: id => { jobId = id; S.waitingJobs.add(id); }});
    await applyNutrition(recipeId, variantId, {items: (res.result && res.result.items) || [], notes: (res.result && res.result.notes) || '', hash: ingHash(r), at: new Date().toISOString()});
  }catch(e){ if(!opts.silent && e && e.code !== 'cancelled') toast(aiErrorText(e)); }
  if(jobId){ S.waitingJobs.delete(jobId); store.markJobSeen(jobId).catch(() => {}); }
  S.analyzing.delete(key); if(S.openId === recipeId) renderDetail();
  renderList();
}
async function applyNutrition(recipeId, variantId, nut){
  const r0 = getR(recipeId); if(!r0) return;
  if(variantId){
    const variants = JSON.parse(JSON.stringify(r0.variants || [])), v = variants.find(x => x.id === variantId);
    if(!v || ingHash(effR(r0, variantId)) !== nut.hash) return;
    v.nutrition = nut;
    await S.db.collection('recipes').doc(recipeId).update({variants});
  } else {
    if(ingHash(r0) !== nut.hash) return;
    await S.db.collection('recipes').doc(recipeId).update({nutrition: nut});
  }
}

/* ====================================================================
   Compositore «Cosa cucino?»: dagli ingredienti che hai alle ricette
   ==================================================================== */
const ING = {list: window.INGREDIENTI || [], byName: new Map(), names: [], stems: new Map()};
function normTxt(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function stemW(w){ return w.length > 4 ? w.replace(/(he|hi|e|i|a|o)$/, '') : w; }
(function buildIng(){
  ING.list.forEach(e => {
    [e.n].concat(e.s || []).forEach(nm => { const k = normTxt(nm); if(k && !ING.byName.has(k)) ING.byName.set(k, e); });
    const st = normTxt(e.n).split(' ').map(stemW).join(' '); if(!ING.stems.has(st)) ING.stems.set(st, e);
  });
  ING.names = [...ING.byName.keys()].sort((a, b) => b.length - a.length);
})();
const DESCR = /\b(fresc[oaie]|extra ?vergine|tritat[oaie]|grattugiat[oaie]|a cubetti|a dadini|a fette|a pezzi|a rondelle|sbucciat[oaie]|biologic[oaie]|bio|lessat[oaie]|cott[oaie]|crud[oaie]|medi[oaie]|grand[ei]|piccol[oaie]|matur[oaie]|q ?b|circa|abbondante|tiepid[oaie]|fredd[oaie]|caldo|calda|a temperatura ambiente|freddo di frigo|del giorno prima|non trattat[oaie])\b/g;
const canonCache = new Map();
function canon(name){
  const raw = normTxt(name); if(!raw) return null;
  if(canonCache.has(raw)) return canonCache.get(raw);
  let e = ING.byName.get(raw) || null;
  if(!e){ const t = raw.replace(DESCR, ' ').replace(/\s+/g, ' ').trim(); e = ING.byName.get(t) || null;
    if(!e){ const pad = ' ' + t + ' '; for(const nm of ING.names){ if(pad.includes(' ' + nm + ' ')){ e = ING.byName.get(nm); break; } } }
    if(!e){ const st = t.split(' ').map(stemW).join(' '); e = ING.stems.get(st) || ING.stems.get(st.split(' ')[0]) || null; }
  }
  canonCache.set(raw, e); return e;
}
function searchIng(q, limit){
  const t = normTxt(q); if(!t) return [];
  const starts = [], inner = [], seen = new Set();
  for(const [nm, e] of ING.byName){
    if(seen.has(e.n)) continue;
    if(nm.startsWith(t) || nm.split(' ').some(w => w.startsWith(t))){ (nm.startsWith(t) ? starts : inner).push({e, via: nm}); seen.add(e.n); }
  }
  const rank = a => (normTxt(a.e.n).startsWith(t) ? 0 : 1) + a.e.n.length / 100;
  return starts.sort((a, b) => rank(a) - rank(b)).concat(inner.sort((a, b) => rank(a) - rank(b))).slice(0, limit || 8);
}
/* --- preferenze del compositore (su questo dispositivo) --- */
const PK = {have: 'composer.have', staples: 'composer.staples', tol: 'composer.tol'};
const lsJ = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } };
const lsW = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const P = {have: lsJ(PK.have, []), staples: lsJ(PK.staples, ['sale', 'pepe', 'olio', 'acqua']), tol: lsJ(PK.tol, 1), q: '', showStaples: false, acIdx: 0};
function pSave(){ lsW(PK.have, P.have); lsW(PK.staples, P.staples); lsW(PK.tol, P.tol); }
function addHave(name){
  const e = canon(name), n = e ? e.n : String(name).trim().toLowerCase();
  if(!n || P.have.includes(n)) return false;
  P.have.push(n); pSave(); return true;
}
/* --- confronto --- */
function recipeNeeds(r){
  const out = [], seen = new Set();
  (r.ingredients || []).forEach((raw, i) => {
    const p = typeof raw === 'string' ? parseIngredient(raw) : (raw.group || raw.name != null ? raw : parseIngredient(raw.text));
    if(!p || p.group || !p.name) return;
    const e = canon(p.name), key = e ? e.n : normTxt(p.name);
    if(seen.has(key)) return; seen.add(key);
    out.push({name: p.name, e, key, qb: p.unit === 'q.b.'});
  });
  return out;
}
function matchRecipe(r){
  const have = new Set(P.have), staples = new Set(P.staples);
  const fam = new Map(); P.have.forEach(n => { const e = canon(n); if(e && e.f && !fam.has(e.f)) fam.set(e.f, e.n); });
  const res = {ok: [], sub: [], miss: [], opt: [], req: 0, used: 0};
  recipeNeeds(r).forEach(n => {
    const key = n.key;
    if(staples.has(key)) return;
    const mine = have.has(key) || (!n.e && P.have.some(h => normTxt(n.name).includes(normTxt(h))));
    if(n.qb){ if(mine) res.used++; else res.opt.push(n.name); return; }
    res.req++;
    if(mine){ res.ok.push(n.e ? n.e.n : n.name); res.used++; }
    else if(n.e && n.e.f && fam.has(n.e.f)){ res.sub.push({need: n.e.n, use: fam.get(n.e.f)}); res.used++; }
    else res.miss.push(n.e ? n.e.n : n.name);
  });
  res.score = res.req ? (res.ok.length + 0.75 * res.sub.length) / res.req : 0;
  return res;
}
function composerResults(){
  if(!P.have.length) return [];
  const cands = [];
  S.recipes.forEach(r0 => {

/* ---------- Timer integrato ---------- */
let audioCtx = null;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
function beep(){
  try{
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    for(let k = 0; k < 3; k++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, now + k*.35); g.gain.exponentialRampToValueAtTime(.3, now + k*.35 + .02); g.gain.exponentialRampToValueAtTime(.0001, now + k*.35 + .3);
      o.start(now + k*.35); o.stop(now + k*.35 + .32);
    }
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){}
}
const TK = 'ricettario.timers.v1';
const T = {list:[], state:'hidden', refs:new Map(), lastBeep:0};
function tLeft(t){ return t.done ? 0 : t.paused ? t.remaining : Math.max(0, t.end - Date.now()); }
function fmtClock(ms){
  const s = Math.ceil(ms/1000), h = Math.floor(s/3600), m = Math.floor((s % 3600)/60), ss = s % 60;
  return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0') : m + ':' + String(ss).padStart(2,'0');
}
function tSave(){ try{ localStorage.setItem(TK, JSON.stringify(T.list)); }catch(e){} }
function tLoad(){ try{ const a = JSON.parse(localStorage.getItem(TK) || '[]'); if(Array.isArray(a)) T.list = a.filter(t => t && t.id && t.total); }catch(e){} }
function startTimer(label, minutes){
  unlockAudio();
  const total = Math.max(1000, Math.round(minutes * 60000));
  T.list.push({id: Math.random().toString(36).slice(2), label: label || 'Timer', total, end: Date.now() + total, paused:false, remaining:0, done:false});
  tSave(); if(T.state === 'hidden') T.state = 'compact';
  tRender(); toast('Timer avviato: ' + fmtMin(minutes));
}
function tAction(id, act){
  const t = T.list.find(x => x.id === id); if(!t) return;
  unlockAudio();
  if(act === 'stop'){ T.list = T.list.filter(x => x !== t); if(!T.list.length && T.state !== 'open') T.state = 'hidden'; }
  else if(act === 'pause' && !t.done){ t.remaining = Math.max(0, t.end - Date.now()); t.paused = true; }
  else if(act === 'resume'){ t.end = Date.now() + t.remaining; t.paused = false; }
  else if(act === 'plus'){ if(t.done){ t.done = false; t.paused = false; t.end = Date.now() + 60000; t.total = Math.max(t.total, 60000); } else if(t.paused) t.remaining += 60000; else t.end += 60000; t.total += 60000; }
  else if(act === 'restart'){ t.done = false; t.paused = false; t.end = Date.now() + t.total; }
  tSave(); tRender();
}
function tPos(){ const d = document.getElementById('tdock'); if(d) d.style.setProperty('--dock-b', tDockBottom() + 'px'); }

        : '<button data-ta="plus" aria-label="Aggiungi un minuto">+1</button>' + (t.paused ? '<button data-ta="resume" aria-label="Riprendi">▶</button>' : '<button data-ta="pause" aria-label="Pausa">❚❚</button>') + '<button data-ta="stop" aria-label="Elimina timer">✕</button>') +
      '</div><div class="t-bar"><i data-r="bar"></i></div><div class="t-lbl">' + esc(t.label) + ' · ' + fmtMin(t.total/60000) + '</div></div>';
  }).join('') : '<div class="tempty">Nessun timer attivo. Avviane uno qui sotto o dai passaggi di una ricetta.</div>';

/* aggiornamento leggero: cambia solo i testi e le barre */
function tTick(fromRender){
  const now = Date.now(); let changed = false;
  T.list.forEach(t => { if(!t.done && !t.paused && t.end <= now){ t.done = true; changed = true; } });
  if(changed){ tSave(); beep(); T.lastBeep = now; if(T.state === 'hidden') T.state = 'compact'; if(!fromRender){ tRender(); return; } }
  const anyDone = T.list.some(t => t.done);
  if(anyDone && now - T.lastBeep > 6000){ beep(); T.lastBeep = now; }
  $('#tdock').classList.toggle('has-done', anyDone);
  T.list.forEach(t => {
    const r = T.refs.get(t.id); if(!r) return;
    const left = tLeft(t), txt = t.done ? 'Fatto!' : fmtClock(left);
    if(r.time.textContent !== txt) r.time.textContent = txt;
    r.bar.style.width = (t.done ? 100 : (1 - left / t.total) * 100).toFixed(1) + '%';
  });
  // barra compatta: il timer più urgente
  const sorted = T.list.slice().sort((a,b) => (b.done - a.done) || (a.paused - b.paused) || (tLeft(a) - tLeft(b)));
  const top = sorted[0];
  if(top){
    const left = tLeft(top);
    const ct = top.done ? 'Fatto!' : fmtClock(left);
    const el = $('#tcTime'); if(el.textContent !== ct) el.textContent = ct;
    const lb = $('#tcLbl'), lt = top.done ? top.label + ' · tocca per fermarlo' : (top.paused ? 'In pausa · ' : '') + top.label;
    if(lb.textContent !== lt) lb.textContent = lt;
    const C = 2 * Math.PI * 17; $('#tcRing').style.strokeDashoffset = (C * (top.done ? 0 : left / top.total)).toFixed(2);
    const more = $('#tcMore'), mt = T.list.length > 1 ? '+' + (T.list.length - 1) : '';
    if(more.textContent !== mt){ more.textContent = mt; more.classList.toggle('hidden', !mt); }
  }
}
setInterval(() => { if(T.list.length) tTick(false); }, 250);
document.addEventListener('visibilitychange', () => { if(!document.hidden && T.list.length) tTick(false); });
/* trascinamento: su per aprire, giù per tornare compatto */
function tInitDrag(){
  const panel = $('#tdockPanel');
  const drag = (el, mode) => {
    let y0 = null, dy = 0, moved = false;
    el.addEventListener('pointerdown', e => { if(e.target.closest('button,input') && mode === 'panel') return; y0 = e.clientY; dy = 0; moved = false; try{ el.setPointerCapture(e.pointerId); }catch(x){} });
    el.addEventListener('pointermove', e => {
      if(y0 == null) return; dy = e.clientY - y0; if(Math.abs(dy) > 6) moved = true;
      if(mode === 'panel' && dy > 0){ panel.classList.add('dragging'); panel.style.transform = 'translateY(' + dy + 'px)'; }
      if(mode === 'compact' && dy < 0) el.style.transform = 'translateY(' + Math.max(dy, -40) + 'px)';
    });
    const end = () => {
      if(y0 == null) return; y0 = null;
      panel.classList.remove('dragging'); panel.style.transform = ''; el.style.transform = '';
      if(mode === 'panel' && dy > 70) setDock('compact');
      if(mode === 'compact'){ if(!moved || dy < -25) openTimers(); }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', () => { y0 = null; panel.classList.remove('dragging'); panel.style.transform = ''; el.style.transform = ''; });
  };

  drag($('#tgrab'), 'panel'); drag($('#tpHead'), 'panel');

  $('#tdock').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.ta){ tAction(b.closest('.trow').dataset.tid, b.dataset.ta); return; }
    if(b.dataset.tp){ startTimer('Timer ' + fmtMin(Number(b.dataset.tp)), Number(b.dataset.tp)); return; }

    if(b.id === 'tpClose') setDock(T.list.length ? 'compact' : 'hidden');

}

async function downscale(file, max){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', .82));
  } finally { URL.revokeObjectURL(url); }
}

const FILE_ACCEPT = 'image/*,.pdf,application/pdf,.docx,.odt,.txt,.md,.rtf,.html,.htm,.csv,.json,.doc';
const MAX_FILE_TEXT = 60000;
let pdfjsP = null;
function loadPdfjs(){
  if(!pdfjsP) pdfjsP = import(new URL('lib/pdf.min.js', location.href).href).then(m => { m.GlobalWorkerOptions.workerSrc = new URL('lib/pdf.worker.min.js', location.href).href; return m; }).catch(e => { pdfjsP = null; throw e; });
  return pdfjsP;
}
function decodeXmlText(s){
  return s.replace(/<[^>]+>/g, '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g, (m, n) => String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCodePoint(parseInt(n,16))).replace(/&amp;/g,'&');
}
async function unzipText(buf, wanted){
  const dv = new DataView(buf), len = buf.byteLength, dec = new TextDecoder();
  let eocd = -1;
  for(let i = len - 22; i >= Math.max(0, len - 65557); i--){ if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('not_zip');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  for(let k = 0; k < n; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nl));
    if(name === wanted){
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const data = new Uint8Array(buf, start, csize);
      if(method === 0) return dec.decode(data);
      if(method === 8){
        if(typeof DecompressionStream === 'undefined') throw new Error('no_inflate');
        const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
        return dec.decode(out);
      }
      throw new Error('zip_method');
    }
    p += 46 + nl + el + cl;
  }
  return null;
}
function rtfToText(s){
  return s.replace(/\\par[d]?/g, '\n').replace(/\{\\\*[^{}]*\}/g, '').replace(/\\'([0-9a-f]{2})/gi, (m, h) => String.fromCharCode(parseInt(h,16))).replace(/\\[a-z]+-?\d* ?/gi, '').replace(/[{}]/g, '').replace(/\n{3,}/g, '\n\n');
}
async function canvasPages(pdf, count){
  const out = [];
  for(let i = 1; i <= Math.min(count, pdf.numPages); i++){
    const page = await pdf.getPage(i); const v1 = page.getViewport({scale:1});
    const sc = Math.min(2.5, 1600 / Math.max(v1.width, v1.height)); const v = page.getViewport({scale: sc});
    const c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: v}).promise;
    out.push(await new Promise(r => c.toBlob(r, 'image/jpeg', .85)));
  }
  return out;
}
/* Restituisce {kind, label, text?, images?} oppure lancia un Error con un messaggio per l'utente */
async function readAttachment(file){
  const name = file.name || 'file', ext = (name.split('.').pop() || '').toLowerCase(), type = file.type || '';
  if(type.startsWith('image/') || ['jpg','jpeg','png','webp','gif','heic','heif'].includes(ext)){
    try{ return {kind:'img', label:'Foto', images:[await downscale(file, 1600)]}; }
    catch(e){ throw new Error('Non riesco ad aprire questa immagine (se è HEIC, prova a esportarla come JPG).'); }
  }
  if(ext === 'pdf' || type === 'application/pdf'){
    let pdfjs; try{ pdfjs = await loadPdfjs(); }catch(e){ throw new Error('Non riesco a caricare il lettore PDF in questa vista. Prova a fare uno screenshot delle pagine.'); }
    const pdf = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
    let text = '';
    for(let i = 1; i <= Math.min(pdf.numPages, 40) && text.length < MAX_FILE_TEXT; i++){
      const tc = await (await pdf.getPage(i)).getTextContent();
      text += tc.items.map(it => (it.str || '') + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
    }
    const pages = pdf.numPages + (pdf.numPages === 1 ? ' pagina' : ' pagine');
    if(text.replace(/\s/g, '').length < 30){
      // PDF scansionato: passo le prime pagine come immagini
      const imgs = await canvasPages(pdf, 3);
      return {kind:'pdf', label:'PDF scansionato · ' + pages, images: imgs};
    }
    return {kind:'pdf', label:'PDF · ' + pages, text: text.slice(0, MAX_FILE_TEXT)};
  }
  if(ext === 'docx' || ext === 'odt'){
    let xml;
    try{ xml = await unzipText(await file.arrayBuffer(), ext === 'docx' ? 'word/document.xml' : 'content.xml'); }
    catch(e){ throw new Error(e.message === 'no_inflate' ? 'Questo telefono non riesce ad aprire i file Word: salvalo come PDF o copia il testo.' : 'Il file sembra danneggiato o non è un documento valido.'); }
    if(!xml) throw new Error('Non trovo testo in questo documento.');
    const t = ext === 'docx'
      ? decodeXmlText(xml.replace(/<w:tab\/>/g, '\t').replace(/<w:br[^>]*\/>/g, '\n').replace(/<\/w:p>/g, '\n'))
      : decodeXmlText(xml.replace(/<text:tab\/>/g, '\t').replace(/<text:line-break\/>/g, '\n').replace(/<\/text:(p|h)>/g, '\n'));
    return {kind:'doc', label: ext === 'docx' ? 'Word' : 'Documento', text: t.replace(/\n{3,}/g, '\n\n').trim().slice(0, MAX_FILE_TEXT)};
  }
  if(ext === 'doc') throw new Error('I vecchi file .doc non si possono leggere qui: aprilo e salvalo come .docx o PDF.');
  if(ext === 'html' || ext === 'htm' || type === 'text/html'){
    const d = new DOMParser().parseFromString(await file.text(), 'text/html');
    d.querySelectorAll('script,style,nav,footer,header,noscript').forEach(n => n.remove());
    return {kind:'txt', label:'Pagina web', text: (d.body ? d.body.innerText || d.body.textContent : '').replace(/\n\s*\n\s*\n+/g, '\n\n').trim().slice(0, MAX_FILE_TEXT)};
  }
  if(ext === 'rtf') return {kind:'txt', label:'Testo', text: rtfToText(await file.text()).slice(0, MAX_FILE_TEXT)};
  const t = await file.text();
  if(/[\u0000-\u0008\u000E-\u001F]/.test(t.slice(0, 2000))) throw new Error('Questo tipo di file non si può leggere. Usa foto, PDF, Word o testo.');
  return {kind:'txt', label:'Testo', text: t.slice(0, MAX_FILE_TEXT)};
}

function createSync(){ return {dirty:false, saving:false, t:null, pending:null}; }
function scheduleWrite(sync, path, body){

  clearTimeout(sync.t); sync.t = setTimeout(() => flushSync(sync), 350);
}
async function flushSync(sync){
  clearTimeout(sync.t);

  sync.saving = true;
  while(sync.dirty){
    sync.dirty = false; const {path, body} = sync.pending;
    try{ await S.db.doc(path).set(body); }
    catch(e){ toast(e && e.code === 'quota_exceeded' ? 'Spazio esaurito.' : 'Salvataggio non riuscito: riprova tra poco.'); }
  }
  sync.saving = false;
}

function aisleOf(name){ const ce = canon(name); if(ce) return ce.a; const n = String(name || '').toLowerCase(); for(const [a, re] of AISLE_RULES) if(re.test(n)) return a; return 'Altro'; }

function toShopItem(p, factor, from){

    (it.from || []).forEach(f => { if(!ex.from.includes(f)) ex.from.push(f); });

/* ---------- Menù della settimana ---------- */
const DAYS = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MEALS = [['pranzo','Pranzo'],['cena','Cena']];
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function weekLabel(mon){
  const sun = addDays(mon, 6), f = d => d.getDate() + ' ' + d.toLocaleDateString('it-IT', {month:'short'}).replace('.','');
  return f(mon) + ' – ' + f(sun) + ' ' + sun.getFullYear();
}
let planUnsub = null;
function subscribePlan(){
  if(!S.db) return;
  if(planSync.dirty) flushSync(planSync);
  planUnsub && planUnsub();
  const key = isoDate(S.planMonday), path = 'plans/' + key;
  S.planKey = key; S.plan = {slots:{}}; S.planLoaded = false; renderPlan();
  planUnsub = S.db.doc(path).onSnapshot(snap => {
    if(S.planKey !== key || busyFor(planSync, path)) return;
    S.plan = {slots: (snap.exists && snap.data().slots) ? JSON.parse(JSON.stringify(snap.data().slots)) : {}};
    S.planLoaded = true; renderPlan();
  }, () => { S.planLoaded = true; renderPlan(); });
}
function savePlan(){ scheduleWrite(planSync, 'plans/' + S.planKey, {slots: S.plan.slots, weekStart: S.planKey, updatedAt: new Date().toISOString()}); renderPlan(); }
async function addToPlan(weekKey, slot, entry){
  if(weekKey === S.planKey){ (S.plan.slots[slot] = S.plan.slots[slot] || []).push(entry); savePlan(); return; }
  try{
    const ref = S.db.doc('plans/' + weekKey); const snap = await ref.get();
    const slots = snap.exists && snap.data().slots ? JSON.parse(JSON.stringify(snap.data().slots)) : {};
    (slots[slot] = slots[slot] || []).push(entry);
    await ref.set({slots, weekStart: weekKey, updatedAt: new Date().toISOString()});
  }catch(e){ toast('Non sono riuscito a salvare il menù'); throw e; }
}
function renderPlan(){
  const el = $('#viewPlan'); if(S.tab !== 'menu') return;
  const today = isoDate(new Date()); const isThis = isoDate(mondayOf(new Date())) === S.planKey;
  const all = Object.values(S.plan.slots || {}).flat(); const nRec = all.filter(e => e.rid && getR(e.rid)).length;
  let h = '<div class="view-head"><button class="btn icon-btn" data-plan="prev" aria-label="Settimana precedente">' + IC.back + '</button>' +
    '<div class="ttl" style="text-align:center"><h2>Menù della settimana</h2><div class="sub">' + esc(weekLabel(S.planMonday)) + (isThis ? ' · questa settimana' : '') + '</div></div>' +
    '<button class="btn icon-btn" data-plan="next" aria-label="Settimana successiva" style="transform:scaleX(-1)">' + IC.back + '</button></div>' +
    '<div class="actions" style="justify-content:center">' + (nRec ? '<button class="btn small primary" data-plan="toshop">Aggiungi tutto alla spesa</button>' : '') + (isThis ? '' : '<button class="btn small" data-plan="today">Torna a oggi</button>') + (all.length ? '<button class="btn small ghost danger" data-plan="clear">Svuota settimana</button>' : '') + '</div>';
  if(S.noDb){ el.innerHTML = h + '<div class="empty"><p>Apri il ricettario dal tuo account Claude per usare il menù.</p></div>'; return; }
  h += '<div class="days">';
  DAYS.forEach((dn, di) => {
    const date = addDays(S.planMonday, di), isToday = isoDate(date) === today;
    h += '<div class="day' + (isToday ? ' today' : '') + '"><div class="day-name">' + dn + ' <small>' + date.getDate() + ' ' + date.toLocaleDateString('it-IT', {month:'long'}) + '</small>' + (isToday ? '<span class="now">Oggi</span>' : '') + '</div>';
    MEALS.forEach(([mk, ml]) => {
      const key = di + '-' + mk, entries = (S.plan.slots || {})[key] || [];
      h += '<div class="slot"><div class="slot-lbl">' + ml + '</div><div class="entries">' + entries.map((e, ei) => {
        if(e.rid){ const r = getR(e.rid) && effR(getR(e.rid), e.vid);
          return '<span class="entry' + (r ? '' : ' gone') + '"><button data-popen="' + esc(e.rid) + '" data-pvid="' + esc(e.vid || '') + '">' + esc(r ? titleWithVariant(r) : 'Ricetta eliminata') + (r && e.servings ? ' <small>· ' + esc(e.servings) + '</small>' : '') + '</button><button class="rm" data-prm="' + key + ':' + ei + '" aria-label="Togli">✕</button></span>'; }
        return '<span class="entry free"><button tabindex="-1">' + esc(e.text) + '</button><button class="rm" data-prm="' + key + ':' + ei + '" aria-label="Togli">✕</button></span>';
      }).join('') + '<button class="add-slot" data-padd="' + key + '" aria-label="Aggiungi a ' + dn + ' ' + ml + '">+</button></div></div>';
    });
    h += '</div>';
  });
  el.innerHTML = h + '</div>' + (S.planLoaded ? '' : '<p class="hint" style="text-align:center">Caricamento…</p>');
}

/* ---------- Dettatura ---------- */
function dictReady(){ return !!S.dict; }
function setupDictation(d){
  S.dict = d;
  d.onPartial(({text}) => { const p = document.getElementById('dict_partial'); if(p) p.textContent = text; });
  d.onFinal(({text}) => {
    const ta = document.getElementById('ai_txt'); if(!ta) return;
    ta.value = ta.value ? ta.value + text : text.replace(/^\s+/, '');
    ta.scrollTop = ta.scrollHeight;
    const p = document.getElementById('dict_partial'); if(p) p.textContent = '';
  });
  d.onState(({state, reason}) => {
    S.dictState = state;
    const b = document.getElementById('dict_btn'); const st = document.getElementById('ai_status');
    if(b){ const on = state !== 'idle'; b.classList.toggle('on', on); b.innerHTML = on ? '<span class="dot"></span> Ferma' : micIcon + ' ' + (document.getElementById('ai_txt') && document.getElementById('ai_txt').value ? 'Continua a dettare' : 'Inizia a dettare'); }
    if(state === 'idle' && reason && st){
      if(reason === 'not_granted') st.textContent = 'Microfono non autorizzato: puoi scrivere nel riquadro o usare il microfono della tastiera.';
      else if(reason === 'unavailable'){ st.textContent = 'La dettatura non è disponibile qui: usa il microfono della tastiera.'; b && b.classList.add('hidden'); }
      else if(reason === 'rate_limited') st.textContent = 'Troppe dettature in corso: riprova tra poco.';
      else if(reason === 'upstream_error') st.textContent = 'Il microfono non ha risposto. Riprova.';
    }
  });
}
const micIcon = IC.mic;
function startDictation(){
  if(!S.dict) return;
  S.dict.start().catch(e => {
    const st = document.getElementById('ai_status'); if(!st) return;
    if(e && e.code === 'not_granted') st.textContent = 'Microfono non autorizzato: puoi scrivere nel riquadro o usare il microfono della tastiera.';
    else if(e && e.code === 'unavailable') st.textContent = 'La dettatura non è disponibile qui: usa il microfono della tastiera.';
  });
}
function stopDictation(){ try{ if(S.dict && S.dict.active()) return S.dict.stop(); }catch(e){} return Promise.resolve(); }

/* ---------- Eventi ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-open]'); if(!t) return;
  const d = t.dataset;
  if(d.f !== undefined && t.classList.contains('chip')){ S.filter = d.f; renderList(); return; }
  if(d.open){ openDetail(d.open); return; }
  if(d.act === 'new' || t.id === 'btnNew'){ if(S.noDb){ toast('Apri il ricettario dal tuo account Claude per salvare.'); } openEditor(null, true); return; }
  if(d.act === 'ai' || t.closest('#btnAI')){ openAI(); return; }
  if(d.act === 'dictate' || t.id === 'btnDictate'){ openAI('dictate'); return; }
  if(d.tab){ setTab(d.tab); return; }
  if(t.closest('#viewPantry')){ composerAction(t); return; }
  if(d.popen){ openDetail(d.popen, d.pvid || null); return; }
  if(d.padd){ openPlanPicker(d.padd); return; }
  if(d.prm){ const [slot, i] = d.prm.split(':'); const arr = S.plan.slots[slot] || []; arr.splice(Number(i), 1); if(!arr.length) delete S.plan.slots[slot]; savePlan(); return; }
  if(d.plan){
    if(d.plan === 'prev' || d.plan === 'next' || d.plan === 'today'){ S.planMonday = d.plan === 'today' ? mondayOf(new Date()) : addDays(S.planMonday, d.plan === 'prev' ? -7 : 7); subscribePlan(); }
    else if(d.plan === 'clear'){ if(await confirmBox('Svuotare il menù di questa settimana?', 'Togli tutti i piatti dal ' + weekLabel(S.planMonday) + '. Le ricette restano nel ricettario.', 'Svuota')){ S.plan.slots = {}; savePlan(); } }
    else if(d.plan === 'toshop'){
      const items = []; Object.values(S.plan.slots).flat().forEach(e => { const r = e.rid && getR(e.rid) && effR(getR(e.rid), e.vid); if(r) items.push(...recipeItems(r, e.servings)); });
      openAddToShop(items, 'Ingredienti di tutti i piatti del ' + weekLabel(S.planMonday));
    }
    return;
  }
  if(d.srm){ S.shop = S.shop.filter(i => i.id !== d.srm); saveShop(); return; }
  if(d.shop){
    if(d.shop === 'copy'){ try{ await navigator.clipboard.writeText(shopAsText()); toast('Lista copiata: incollala dove vuoi'); }catch(e){ toast('Copia non riuscita'); } }
    else if(d.shop === 'cleardone'){ S.shop = S.shop.filter(i => !i.checked); saveShop(); }
    else if(d.shop === 'clear'){ if(await confirmBox('Svuotare la lista della spesa?', 'Tutti i prodotti vengono tolti dalla lista.', 'Svuota')){ S.shop = []; saveShop(); } }
    return;
  }
  if(t.closest('#btnMenu') || t.closest('#bookBtn')){ openSettings(); return; }
  if(d.st){ settingsAction(t); return; }
  if(t.closest('#sheetHealth')){ healthPlanAction(t); return; }
  // dettaglio
  if(t.closest('#sheetDetail')){
    const r0 = getR(S.openId); if(!r0) return;
    const r = effR(r0, S.variantId);
    if(d.vtab !== undefined){ S.variantId = d.vtab || null; S.servings = Number(effR(r0, S.variantId).servings) || null; S.checked = new Set(); renderDetail(); return; }
    if(d.hmeal){ S.healthMeal = d.hmeal; renderDetail(); return; }
    if(d.act === 'close') closeDetail();
    else if(d.act === 'edit'){ if(S.variantId){ const c = JSON.parse(JSON.stringify(r)); c.variantName = r.variantName; openEditor(c, false, null, {of: r0.id, id: S.variantId}); } else openEditor(r0, false); }
    else if(d.act === 'voiceedit') voiceEdit(false);
    else if(d.act === 'addvariant') openNewVariant(r0, r);
    else if(d.act === 'fitplan') openNewVariant(r0, r, 'plan');
    else if(d.act === 'delvariant') deleteVariant(r0, S.variantId);
    else if(d.act === 'analyze') analyzeNutrition(r0.id, S.variantId);
    else if(d.act === 'healthplan') openHealthPlan();
    else if(d.act === 'cook') openCook();
    else if(d.act === 'toshop'){ if(S.noDb) return toast('Apri il ricettario dal tuo account Claude.'); openAddToShop(recipeItems(r, S.servings || Number(r.servings) || null), titleWithVariant(r) + (S.servings ? ', per ' + S.servings + ' ' + (r.servingsUnit || 'porzioni') : '')); }
    else if(d.act === 'toplan'){ if(S.noDb) return toast('Apri il ricettario dal tuo account Claude.'); openAddToPlan(r); }
    else if(d.act === 'fav'){ try{ await S.db.collection('recipes').doc(r0.id).update({favorite:!r0.favorite, updatedAt:new Date().toISOString()}); }catch(err){ toast('Non sono riuscito a salvare'); } }
    else if(d.act === 'copy'){ try{ await navigator.clipboard.writeText(recipeAsText(r)); toast('Ricetta copiata: incollala dove vuoi'); }catch(err){ toast('Copia non riuscita'); } }
    else if(d.act === 'dup'){ const c = JSON.parse(JSON.stringify(r)); delete c.id; delete c.variants; delete c.nutrition; c.title = titleWithVariant(r) + ' (copia)'; c.photoId = null; c.favorite = false; openEditor(c, true); }
    else if(d.act === 'del'){
      if(await confirmBox('Eliminare «' + (r0.title || 'questa ricetta') + '»?', 'La ricetta' + ((r0.variants || []).length ? ', tutte le sue varianti' : '') + ' e la sua foto vengono cancellate da tutti i tuoi dispositivi. Non si può annullare.', 'Elimina')){
        try{ await S.db.collection('recipes').doc(r0.id).delete(); if(r0.photoId && S.assets){ try{ await S.assets.delete(r0.photoId); }catch(x){} } closeDetail(); toast('Ricetta eliminata'); }catch(err){ toast('Non sono riuscito a eliminarla'); }
      }
    }
    else if(d.serv){
      const base = Number(r.servings) || 1;
      if(d.serv === 'reset') S.servings = base; else S.servings = Math.max(1, (S.servings || base) + Number(d.serv));
      renderDetail();
    }
    else if(d.timer !== undefined){
      const s = (r.steps || [])[Number(d.timer)]; const st = typeof s === 'string' ? {text:s} : s;
      const m = st.timerMin != null && st.timerMin !== '' ? Number(st.timerMin) : detectMinutes(st.text);
      if(m) startTimer(titleWithVariant(r) + ' · passo ' + (Number(d.timer)+1), m);
    }
    return;
  }
  // cucina
  if(d.cook){
    const r = curR();
