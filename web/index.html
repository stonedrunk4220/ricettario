/* --- dettatura con il riconoscimento vocale del browser (Chrome, Safari, Edge) --- */
function makeDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  let rec = null, state = 'idle', wanted = false, lastErr = null, stopWaiters = [];
  const hP = [], hF = [], hS = [];
  const setState = (s, reason) => { state = s; hS.forEach(h => h(reason ? {state:s, reason} : {state:s})); };
  const make = () => {
    rec = new SR(); rec.lang = 'it-IT'; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => { if(state !== 'listening') setState('listening'); };
    rec.onresult = e => {
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal){ const t = r[0].transcript.trim(); if(t) hF.forEach(h => h({text: ' ' + t})); }
        else interim += r[0].transcript;
      }
      hP.forEach(h => h({text: interim}));
    };
    rec.onerror = e => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ lastErr = 'not_granted'; wanted = false; }
      else if(e.error === 'no-speech' || e.error === 'aborted'){ /* riparte da sola */ }
      else { lastErr = 'upstream_error'; wanted = false; }
    };
    rec.onend = () => {
      hP.forEach(h => h({text: ''}));
      if(wanted && !lastErr && !document.hidden){ try{ rec.start(); return; }catch(x){} }
      const reason = lastErr || 'stopped'; lastErr = null; wanted = false;
      setState('idle', reason); stopWaiters.splice(0).forEach(f => f());
    };
  };
  return {
    start(){ wanted = true; lastErr = null; if(!rec) make(); if(state === 'idle') setState('starting'); try{ rec.start(); }catch(e){} return Promise.resolve(); },
    stop(){ if(state === 'idle') return Promise.resolve(); wanted = false; return new Promise(res => { stopWaiters.push(res); setState('finishing'); try{ rec.stop(); }catch(e){ res(); } setTimeout(res, 1500); }); },
    active(){ return state !== 'idle'; },
    onPartial(h){ hP.push(h); }, onFinal(h){ hF.push(h); }, onState(h){ hS.push(h); }
  };
}

/* --- messaggi di errore di Claude --- */
function aiErrorText(e){
  const c = e && e.code;
  if(c === 'limit_user') return 'Hai usato tutte le richieste all\'AI di questo mese' + (e.limit ? ' (' + e.limit + ')' : '') + '. Si azzerano il 1° del mese.';
  if(c === 'limit_total') return 'Il ricettario ha raggiunto il limite mensile di richieste all\'AI. Si azzera il 1° del mese.';
  if(c === 'missing_api_key') return 'L\'assistente AI non è ancora configurato sul server: manca una chiave (vedi la guida, passo 5).';
  if(c === 'page_unreachable' || c === 'bad_url') return 'Non riesco ad aprire quella pagina (il sito potrebbe bloccare l\'accesso). Incolla il testo o allega uno screenshot.';
  if(c === 'rate_limited') return 'I servizi AI gratuiti hanno raggiunto il loro limite per ora: riprova tra qualche minuto (o domani).';
  if(c === 'ai_failed') return 'Nessun servizio AI ha risposto in questo momento: riprova tra poco.';
  if(c === 'offline') return 'Sembra che tu sia offline: controlla la connessione e riprova.';
  if(c === 'not_signed_in') return 'La sessione è scaduta: esci e rientra.';
  if(c === 'invalid_json') return 'L\'assistente ha risposto in modo inatteso: riprova.';
  if(c === 'timeout') return 'L\'assistente ci sta mettendo troppo: riprova tra poco.';
  if(c === 'too_many_jobs') return 'Hai già alcune richieste in preparazione: aspetta che finiscano.';
  if(c === 'cancelled') return '';
  return 'Non ci sono riuscito. Riprova tra poco.' + (e && e.detail ? ' (Dettaglio: ' + String(e.detail).slice(0, 160) + ')' : '');
}

/* --- dopo l'accesso: ricettari e dati --- */
async function afterLogin(){
  if(BOOT.started || BOOT.recovery) return; BOOT.started = true;
  hideAuth();
  try{
    for(let i = 0; i < 4; i++){ BOOT.books = await store.books.list(); if(BOOT.books.length) break; await new Promise(r => setTimeout(r, 700)); }
    if(!BOOT.books.length){ await store.books.create('Il mio ricettario'); BOOT.books = await store.books.list(); }
    BOOT.profile = await store.profile();
    try{ const st = await store.getSettings(); S.health = Object.assign(defaultHealth(), (st && st.health) || {}); }catch(x){ S.health = defaultHealth(); }
  }catch(e){ BOOT.started = false; toast('Non riesco a raggiungere il server: controlla la connessione.'); setTimeout(afterLogin, 5000); return; }
  const joined = await handlePendingInvite();
  if(joined) BOOT.books = await store.books.list();
  let last = null; try{ last = localStorage.getItem('book'); }catch(e){}
  const pick = (joined && BOOT.books.find(b => b.id === joined)) || BOOT.books.find(b => b.id === last) || BOOT.books[0];
  selectBook(pick.id);
}
function selectBook(id){
  const b = BOOT.books.find(x => x.id === id); if(!b) return;
  BOOT.book = b; try{ localStorage.setItem('book', id); }catch(e){}
  $('#bookName').textContent = b.name;
  document.title = b.name;
  if(S.openId) closeDetail();
  S.recipes = []; S.loaded = false; S.shop = []; S.shopLoaded = false; S.plan = {slots:{}}; S.planLoaded = false; S.lastSig = null;
  store.setBook(id);
  if(!BOOT.dataStarted){ BOOT.dataStarted = true; startData(); scheduleRecovery(1500); }
  renderList(); renderShop(); renderPlan(); updateBadge();
}
function startData(){
  const db = S.db;
  db.doc('lists/shopping').onSnapshot(snap => {
    if(busyFor(shopSync, 'lists/shopping')) return;
    S.shop = snap.exists && Array.isArray(snap.data().items) ? JSON.parse(JSON.stringify(snap.data().items)) : [];
    S.shopLoaded = true; renderShop(); updateBadge();
  }, () => { S.shopLoaded = true; renderShop(); });
  subscribePlan();
  let timer = setTimeout(() => { S.unreachable = true; if(!S.loaded){ S.loaded = true; } renderList(); }, 10000);
  db.collection('recipes').onSnapshot(snap => {
    S.recipes = snap.docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data()));
    S.loaded = true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.unreachable = false; }

    if(S.tab === 'menu') renderPlan();
    if(S.tab === 'cosa' && document.activeElement && document.activeElement.id !== 'pt_in') renderComposer();
    if(!$('#cook').classList.contains('hidden')) renderCook();
  }, () => { clearTimeout(timer); S.loaded = true; S.unreachable = true; renderList(); });
}

/* --- ricette preparate mentre l'app era chiusa o in standby --- */
let recovering = false, recoverT = null;
function scheduleRecovery(ms){ clearTimeout(recoverT); recoverT = setTimeout(checkReadyJobs, ms || 600); }
async function checkReadyJobs(){
  if(!store || !BOOT.started || !BOOT.book || recovering || S.edit || document.hidden) return;
  recovering = true;
  try{
    const jobs = await store.pendingJobs();
    for(const j of jobs){
      if(S.waitingJobs.has(j.id) || j.status === 'pending') continue;
      if(j.action === 'nutrition' && j.status === 'done' && j.meta && j.meta.recipeId){
        store.markJobSeen(j.id).catch(() => {});
        applyNutrition(j.meta.recipeId, j.meta.variantId || null, {items: (j.result && j.result.items) || [], notes: (j.result && j.result.notes) || '', hash: j.meta.hash, at: new Date().toISOString()}).catch(() => {});
        continue;
      }
      if(j.status === 'error' || j.action === 'edit' || j.action === 'nutrition'){ store.markJobSeen(j.id).catch(() => {}); continue; }
      const d = normDraft(j.result); if(j.photo_path) d.photoId = j.photo_path;
      const meta = j.meta || {}; if(meta.url && !d.source) d.source = meta.url;
      const ok = await askBox('Ricetta pronta', '«' + (d.title || 'Nuova ricetta') + '» è stata preparata mentre eri via. Vuoi aprirla per controllarla e salvarla?', 'Apri');
      await store.markJobSeen(j.id).catch(() => {});
      if(ok) openEditor(d, true, {source: meta.source || 'create', transcript: meta.transcript || '', doubts: d._doubts || []});
      break;
    }
  }catch(e){ /* nessun problema: riprova alla prossima apertura */ }
  recovering = false;
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleRecovery(900); });

/* --- colore d'accento --- */
const ACCENTS = [['pomodoro', 'Pomodoro', '#D93A22'], ['zafferano', 'Zafferano', '#D98A00'], ['basilico', 'Basilico', '#2E6A4E'], ['mare', 'Mare', '#1E6FD9'], ['melanzana', 'Melanzana', '#7A3FD1']];
function curAccent(){ return document.documentElement.getAttribute('data-accent') || 'pomodoro'; }
function setAccent(k){
  if(k === 'pomodoro') document.documentElement.removeAttribute('data-accent'); else document.documentElement.setAttribute('data-accent', k);
  try{ localStorage.setItem('accent', k); }catch(e){}
  const c = (ACCENTS.find(a => a[0] === k) || ACCENTS[0])[2];
  document.querySelectorAll('meta[name="theme-color"]').forEach((m, i) => { if(i === 0) m.setAttribute('content', c); });
}

/* --- impostazioni --- */
async function openSettings(){
  const el = $('#sheetSettings'); el.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  renderSettings();
  try{
    const [books, members, usage] = await Promise.all([store.books.list(), store.books.members(BOOT.book.id), store.aiUsage().catch(() => null)]);
    BOOT.books = books; BOOT.members = members; BOOT.usage = usage;
    const cur = books.find(b => b.id === BOOT.book.id); if(cur){ BOOT.book = cur; $('#bookName').textContent = cur.name; }
    renderSettings();
  }catch(e){ toast('Non riesco a caricare le impostazioni.'); }
}
function closeSettings(){ $('#sheetSettings').classList.add('hidden'); if(!S.openId && !S.edit) document.body.style.overflow = ''; }
function renderSettings(){
  const b = BOOT.book, owner = b && b.role === 'owner', ms = BOOT.members || [];
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('#sheetSettings').innerHTML =
    '<div class="sheet-bar"><div class="sheet-bar-inner"><button class="btn icon-btn ghost" data-st="close" aria-label="Chiudi">' + IC.back + '</button><strong style="font-size:17px">Impostazioni</strong><div class="spacer"></div></div></div>' +
    '<div class="sheet-content">' +
      '<section class="section"><h2>Ricettari</h2><div class="set-list">' + BOOT.books.map(x =>
        '<button class="set-row' + (x.id === b.id ? ' on' : '') + '" data-st="book" data-id="' + esc(x.id) + '"><span class="radio"></span><span class="grow"><b>' + esc(x.name) + '</b><small>' + (x.role === 'owner' ? 'Tuo' : 'Condiviso con te') + '</small></span></button>').join('') +
        '<button class="set-row add" data-st="newbook">' + IC.plus + '<span class="grow"><b>Nuovo ricettario</b><small>Per esempio uno per la famiglia, da condividere</small></span></button></div></section>' +
      '<section class="section"><h2>' + esc(b.name) + '</h2><div class="set-card">' +
        '<div class="set-sub">Persone</div><ul class="members">' + (ms.length ? ms.map(m => '<li><span class="avatar">' + esc((m.name || m.email || '?').charAt(0).toUpperCase()) + '</span><span class="grow"><b>' + esc(m.name || m.email) + (m.me ? ' (tu)' : '') + '</b><small>' + (m.role === 'owner' ? 'Proprietario' : 'Può modificare') + '</small></span>' + (owner && !m.me ? '<button class="btn small ghost danger" data-st="kick" data-id="' + esc(m.user_id) + '">Rimuovi</button>' : '') + '</li>').join('') : '<li class="hint">Caricamento…</li>') + '</ul>' +
        '<div class="set-actions"><button class="btn primary" data-st="invite">' + IC.share + ' Invita qualcuno</button>' +
        (owner ? '<button class="btn" data-st="rename">Rinomina</button>' : '') +
        (owner ? (BOOT.books.filter(x => x.role === 'owner').length > 1 ? '<button class="btn ghost danger" data-st="delbook">Elimina ricettario</button>' : '') : '<button class="btn ghost danger" data-st="leave">Esci da questo ricettario</button>') + '</div>' +
        '<p class="hint">Chi inviti vede e modifica ricette, menù e lista della spesa di questo ricettario. Il link vale 14 giorni.</p>' +
      '</div></section>' +
      '<section class="section"><h2>Aspetto</h2><div class="set-card"><div class="set-sub">Colore</div><div class="swatches">' + ACCENTS.map(([k, l, c]) => '<button class="swatch" data-st="accent" data-v="' + k + '" aria-pressed="' + (curAccent() === k) + '" style="--sw:' + c + '"><span></span>' + l + '</button>').join('') + '</div></div></section>' +
      '<section class="section"><h2>Healthy</h2><div class="set-card"><div class="set-line"><span class="grow"><b>Il mio piano alimentare</b><small>' + (healthOn() ? 'Attivo: le ricette mostrano se sono in linea con il piano' : 'Spento') + '</small></span><button class="btn small' + (healthOn() ? '' : ' primary') + '" data-st="health">' + (healthOn() ? 'Modifica' : 'Imposta') + '</button></div><p class="hint">Il piano è solo tuo: anche nei ricettari condivisi gli altri non lo vedono.</p></div></section>' +
      '<section class="section"><h2>Il tuo account</h2><div class="set-card">' +
        '<div class="set-line"><span class="grow"><b>' + esc((BOOT.profile && BOOT.profile.display_name) || '') + '</b><small>' + esc((BOOT.profile && BOOT.profile.email) || '') + '</small></span><button class="btn small" data-st="name">Cambia nome</button></div>' +
        (BOOT.usage != null ? '<div class="set-line"><span class="grow"><b>Assistente AI questo mese</b><small>' + BOOT.usage + (BOOT.usage === 1 ? ' richiesta' : ' richieste') + ' usate</small></span></div>' : '') +
        '<div class="set-actions"><button class="btn" data-st="pw">Cambia password</button><button class="btn ghost danger" data-st="logout">Esci</button></div>' +
      '</div></section>' +
      '<section class="section"><h2>Dati</h2><div class="set-card"><div class="set-actions"><button class="btn" data-st="backup">Backup e ripristino</button></div><p class="hint">Per portare qui le ricette dal vecchio ricettario su Claude: là apri ⋮ → «Scarica backup completo, con foto», poi qui «Backup e ripristino» → «Ripristina».</p></div></section>' +
      (standalone ? '' : '<section class="section"><h2>App sul telefono</h2><div class="set-card">' +
        (BOOT.installEvt ? '<div class="set-actions"><button class="btn primary" data-st="install">Installa l\'app</button></div>' : '') +
        '<p class="hint">' + (isIOS ? 'Su iPhone: apri questa pagina con Safari, tocca Condividi (il quadrato con la freccia) e poi «Aggiungi alla schermata Home».' : 'Su Android: nel menu ⋮ di Chrome tocca «Installa app» o «Aggiungi a schermata Home». Avrai un\'icona e l\'app si apre a tutto schermo.') + '</p></div></section>') +
    '</div>';
}
async function settingsAction(btn){
  const a = btn.dataset.st, b = BOOT.book;
  if(a === 'close') return closeSettings();
  if(a === 'book'){ if(btn.dataset.id !== b.id){ selectBook(btn.dataset.id); toast('Ricettario: ' + BOOT.book.name); } closeSettings(); return; }
  if(a === 'newbook'){ const n = await promptBox('Nuovo ricettario', 'Nome', 'Ricettario di famiglia', 'Crea'); if(!n) return; try{ const id = await store.books.create(n); BOOT.books = await store.books.list(); selectBook(id); toast('Creato «' + n + '»'); openSettings(); }catch(e){ toast('Non sono riuscito a crearlo.'); } return; }
  if(a === 'rename'){ const n = await promptBox('Rinomina ricettario', 'Nome', b.name, 'Salva'); if(!n) return; try{ await store.books.rename(b.id, n); b.name = n; $('#bookName').textContent = n; openSettings(); }catch(e){ toast('Non sono riuscito a rinominarlo.'); } return; }
  if(a === 'invite'){
    try{
      const code = await store.books.invite(b.id);
      const link = location.origin + location.pathname + '?invito=' + code;
      const text = 'Ti invito nel mio ricettario «' + b.name + '»: ' + link;
      if(navigator.share){ try{ await navigator.share({title: b.name, text: 'Ti invito nel mio ricettario «' + b.name + '»', url: link}); return; }catch(x){ if(x && x.name === 'AbortError') return; } }
      modal('<h3>Invita nel ricettario</h3><p>Manda questo link a chi vuoi invitare. Vale 14 giorni.</p><input class="inp" readonly value="' + esc(link) + '"><div class="modal-actions"><button class="btn" data-a="x">Chiudi</button><button class="btn primary" data-a="cp">Copia il link</button></div>',
        (m, close) => { m.querySelector('[data-a=x]').onclick = close; m.querySelector('[data-a=cp]').onclick = async () => { try{ await navigator.clipboard.writeText(text); toast('Link copiato'); close(); }catch(x){ m.querySelector('input').select(); } }; });
    }catch(e){ toast('Non sono riuscito a creare l\'invito.'); }
    return;
  }
  if(a === 'kick'){ const m = (BOOT.members || []).find(x => x.user_id === btn.dataset.id); if(!(await confirmBox('Rimuovere ' + (m ? (m.name || m.email) : 'questa persona') + '?', 'Non vedrà più questo ricettario. Potrai reinvitarla quando vuoi.', 'Rimuovi'))) return; try{ await store.books.removeMember(b.id, btn.dataset.id); openSettings(); }catch(e){ toast('Non sono riuscito a rimuoverla.'); } return; }
  if(a === 'leave'){ if(!(await confirmBox('Uscire da «' + b.name + '»?', 'Non vedrai più le sue ricette. Per rientrare ti servirà un nuovo invito.', 'Esci'))) return; try{ await store.books.leave(b.id); BOOT.books = await store.books.list(); selectBook(BOOT.books[0].id); closeSettings(); }catch(e){ toast('Non ci sono riuscito.'); } return; }
  if(a === 'delbook'){ if(!(await confirmBox('Eliminare «' + b.name + '»?', 'Tutte le sue ricette, il menù e la lista della spesa vengono cancellati per tutti i membri. Non si può annullare.', 'Elimina'))) return; try{ await store.books.remove(b.id); BOOT.books = await store.books.list(); selectBook(BOOT.books[0].id); closeSettings(); toast('Ricettario eliminato'); }catch(e){ toast('Non sono riuscito a eliminarlo.'); } return; }
  if(a === 'name'){ const n = await promptBox('Il tuo nome', 'Nome', BOOT.profile && BOOT.profile.display_name, 'Salva'); if(!n) return; await store.setName(n); BOOT.profile = await store.profile(); openSettings(); return; }
  if(a === 'pw'){ closeSettings(); showAuth('newpw'); return; }
  if(a === 'logout'){ if(!(await confirmBox('Uscire dall\'account?', 'Su questo dispositivo dovrai accedere di nuovo. Le ricette restano salvate.', 'Esci'))) return; try{ Object.keys(localStorage).filter(k => k.startsWith('cache.') || k === 'book').forEach(k => localStorage.removeItem(k)); }catch(e){} await store.auth.signOut(); location.reload(); return; }
  if(a === 'backup'){ openMenu(); return; }
  if(a === 'health'){ openHealthPlan(); return; }
  if(a === 'accent'){ setAccent(btn.dataset.v); renderSettings(); return; }
  if(a === 'install' && BOOT.installEvt){ BOOT.installEvt.prompt(); try{ await BOOT.installEvt.userChoice; }catch(e){} BOOT.installEvt = null; renderSettings(); return; }
}

/* --- avvio --- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); BOOT.installEvt = e; });
async function boot(){
  renderList();
  tLoad(); tInitDrag(); tRender();
  setTab((location.hash || '').replace('#',''), true);
  window.addEventListener('hashchange', () => setTab((location.hash || '').replace('#',''), true));
  captureInvite();
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if(!cfgOk()){ showSetupNeeded(); return; }
  try{ CFG.supabaseUrl = new URL(String(CFG.supabaseUrl).trim()).origin; }catch(e){}
  store = makeStore(CFG);
  store.onPhotosLoaded(() => { renderList(); if(S.openId) renderDetail(); if(S.edit) renderEditor(); });
  S.waitingJobs = new Set();
  S.db = store.db; S.assets = store.assets; S.sample = {server: true}; S.sampleImages = true; S.sampleMaxImages = 4; S.downloads = localDownloads;
  const d = makeDictation(); if(d) setupDictation(d);
  store.auth.onChange(ev => {
    if(ev === 'PASSWORD_RECOVERY'){ BOOT.recovery = true; showAuth('newpw'); }
    else if(ev === 'SIGNED_IN' && !BOOT.recovery) afterLogin();
  });
  let session = null; try{ session = await store.auth.session(); }catch(e){}
  if(BOOT.recovery || location.hash.includes('type=recovery')) return;
  if(session) afterLogin(); else showAuth(localStorage.getItem('pendingInvite') ? 'signup' : 'login');
}
window.addEventListener('offline', () => toast('Sei offline: puoi consultare le ricette, le modifiche richiedono la rete.'));
window.S = S; window.T = T; window.BOOT = BOOT; window.showAuth = showAuth; window.getStore = () => store; window.parseIngredient = parseIngredient;
boot();
</script>
